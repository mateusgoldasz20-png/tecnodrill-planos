<!-- Diagnostico de erros visiveis na tela -->
<script>
window.__appLoaded = false;
window.onerror = function(msg, src, line, col) {
  var d = document.getElementById('__diag');
  if(d){ d.style.display='block'; d.textContent += 'ERRO: '+msg+'\n  em '+src+':'+line+':'+col+'\n'; }
  return false;
};
window.addEventListener('unhandledrejection', function(e) {
  var d = document.getElementById('__diag');
  if(d){ d.style.display='block'; d.textContent += 'PROMISE: '+(e.reason||e)+'\n'; }
});
window.addEventListener('load', function() {
  setTimeout(function() {
    if (!window.__appLoaded) {
      var d = document.getElementById('__diag');
      if(d){ d.style.display='block'; }
      var missing = [];
      if(typeof React==='undefined') missing.push('React');
      if(typeof ReactDOM==='undefined') missing.push('ReactDOM');
      if(typeof Papa==='undefined') missing.push('PapaParse');
      if(typeof XLSX==='undefined') missing.push('SheetJS/xlsx');
      if(typeof Babel==='undefined') missing.push('Babel');
      if(d){
        d.style.display='block';
        d.textContent += (missing.length ? 'Libs nao carregaram: '+missing.join(', ')+'\n' : 'Libs OK mas React nao renderizou. Erro de transpilacao ou runtime.\n');
        d.textContent += 'Abra DevTools (F12) > Console para detalhes.\n';
      }
    }
  }, 8000);
});
</script>

/* UTILS - sem caracteres unicode especiais */
function cleanCode(v) { if (!v && v !== 0) return ""; return String(v).replace(/\D/g,"").replace(/^0+/,""); }
function normCol(s) { return String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]/g,""); }
function normNum(v) {
  if (v===null||v===undefined||v==="") return 0;
  if (typeof v==="number") return isNaN(v)?0:v;
  var s=String(v).trim().replace(/[^\d.,\-]/g,"");
  if (s===""||s==="-") return 0;
  var n;
  if (s.indexOf(",")>=0) { n=parseFloat(s.replace(/\./g,"").replace(",",".")); }
  else if (/^-?\d+\.\d{1,2}$/.test(s)) { n=parseFloat(s); }
  else { n=parseFloat(s.replace(/\./g,"")); }
  return isNaN(n)?0:n;
}
function parseXlDate(v) {
  if (!v) return null;
  if (v instanceof Date) return v;
  if (typeof v==="number") { var d=new Date(Math.round((v-25569)*86400*1000)); return isNaN(d.getTime())?null:d; }
  if (typeof v==="string") {
    var s=v.trim();
    if (/^\d{4}-\d{2}-\d{2}/.test(s)) { var d2=new Date(s); return isNaN(d2.getTime())?null:d2; }
    if (/^\d{2}\/\d{2}\/\d{4}/.test(s)) { var pts=s.split("/"); var d3=new Date(pts[2]+"-"+pts[1]+"-"+pts[0]); return isNaN(d3.getTime())?null:d3; }
  }
  return null;
}
function fmtNum(v) { return Number(v||0).toLocaleString("pt-BR",{minimumFractionDigits:0,maximumFractionDigits:2}); }
function fmtDate(d) { return (!d||!(d instanceof Date))?"--":d.toLocaleDateString("pt-BR"); }
function isPast(d) {
  if (!d || !(d instanceof Date) || isNaN(d.getTime())) return false;
  var t=new Date(); t.setHours(0,0,0,0);
  var x=new Date(d.getTime()); x.setHours(0,0,0,0);
  return x < t;
}
function posCode(v) { if(!v) return "0"; var s=String(v).toLowerCase(); if(s.indexOf("encerr")>=0) return "5"; var m=s.match(/^(\d+)/); return m?m[1]:"0"; }
function sitCode(v) { var m=String(v||"").match(/^(\d+)/); return m?m[1]:"0"; }
function classifyRef(ref) {
  var r=String(ref||"");
  if (!r||r.length<5) return "outros";
  var s=r.substring(3,5);
  if (s==="01") return "peca_fabricada";
  // 50 = conjunto mecanico / 90 = conjunto eletrico (ex: 88290001 CONJUNTO
  // ELETRICO HOTMELTER, 88190001 CJ. ELETRICO SIGMA 4C) - ambos sao CJ e
  // precisam aparecer como conjunto pai na explosao do BOM.
  if (s==="50"||s==="90") return "conjunto";
  return "outros";
}
function isSupply(ref) {
  var r=String(ref||"").trim();
  // Deve ter exatamente 8 digitos numericos
  if (!/^\d{8}$/.test(r)) return false;
  var fd=r[0];
  // Regra 1: insumo GERAL - 1o digito entre 1 e 7
  // Cobre dezenas: 10-19, 20-29, 30-39, 40-49, 50-59, 60-69, 70-79
  // Ex: 30103046 (parafuso), 51201126 (terminal), 60501050 (combustivel)
  if (fd>='1' && fd<='7') return true;
  // Regra 2: insumo de PROJETO - 1o digito 8 ou 9, posicoes 3-4 no intervalo 40-49
  // Ex: 82946001 (fundido, pos3-4=46), 91745087 (chapa, pos3-4=45)
  // NAO sao insumos: pos3-4=01 (peca fabricada) ou 50 (conjunto)
  if (fd==='8' || fd==='9') {
    var dez=parseInt(r.substring(3,5),10);
    if (dez>=40 && dez<=49) return true;
  }
  return false;
}

function csvCell(v) { var s=String(v==null?"":v); return (s.indexOf(",")>=0||s.indexOf('"')>=0||s.indexOf("\n")>=0)?'"'+s.replace(/"/g,'""')+'"':s; }
function triggerDL(name,content,mime) {
  mime=mime||"text/csv";
  var b=new Blob(["\ufeff"+content],{type:mime+";charset=utf-8"});
  var u=URL.createObjectURL(b);
  var a=document.createElement("a"); a.href=u; a.download=name;
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(u);
}
function exportCsv(name,rows,cols) {
  if (!rows||!rows.length) return;
  var h=cols.map(function(c){return csvCell(c.label);}).join(",");
  var b=rows.map(function(r){return cols.map(function(c){return csvCell(c.get?c.get(r):r[c.key]==null?"":r[c.key]);}).join(",");}).join("\n");
  triggerDL(name,h+"\n"+b);
}
function exportJson(name,data) { triggerDL(name,JSON.stringify(data,null,2),"application/json"); }
/* Uma chave de pdfIndex so representa um codigo de referencia reconhecido se for puramente numerica (6 a 10 digitos).
   Chaves que nao batem nesse formato sao o nome de arquivo inteiro caindo no fallback do loadPdfFolder,
   ou seja: o PDF foi recebido mas o codigo NAO foi reconhecido no nome do arquivo. */
function isPdfRefCode(k) { return /^\d{6,10}$/.test(k); }
/* Arvore */
function buildSeqMap(rows) { var m={}; rows.forEach(function(r){if(r.seqOp!=null)m[r.seqOp]=r;}); return m; }
var _descCache=(typeof WeakMap!=="undefined")?new WeakMap():null;
function getChildIndex(rows){
  if(_descCache){
    var hit=_descCache.get(rows);
    if(hit) return hit;
  }
  var idx={};
  for(var i=0;i<rows.length;i++){
    var o=rows[i].origemSequencia;
    var k=(o===null||o===undefined)?"__root__":String(o);
    if(!idx[k]) idx[k]=[];
    idx[k].push(rows[i]);
  }
  var entry={children:idx,memo:{}};
  if(_descCache) _descCache.set(rows,entry);
  return entry;
}
function getDesc(seq,rows) {
  if(!rows||!rows.length||seq===null||seq===undefined) return [];
  var e=getChildIndex(rows);
  var mk=String(seq);
  if(e.memo[mk]) return e.memo[mk];
  var res=[],stack=[seq],seen={},guard=0;
  while(stack.length && guard++ < 100000){
    var cur=stack.pop();
    var ck=String(cur);
    if(seen[ck]) continue;
    seen[ck]=1;
    var kids=e.children[ck]||[];
    for(var i=0;i<kids.length;i++){
      res.push(kids[i]);
      if(kids[i].seqOp!==null&&kids[i].seqOp!==undefined) stack.push(kids[i].seqOp);
    }
  }
  e.memo[mk]=res;
  return res;
}
function findRoot(row,sm) { var cur=row,vis={}; while(cur.origemSequencia!=null&&!vis[cur.seqOp]){vis[cur.seqOp]=1;var p=sm[cur.origemSequencia];if(!p)break;cur=p;} return cur; }
function findParentSet(row,sm) { var cur=row,vis={}; while(cur.origemSequencia!=null&&!vis[cur.seqOp]){vis[cur.seqOp]=1;var p=sm[cur.origemSequencia];if(!p)break;if(classifyRef(p.referencia)==="conjunto")return p;cur=p;} return null; }
function enrichRows(rows) {
  var sm=buildSeqMap(rows);
  return rows.map(function(r){
    if(r.tipoReferencia==="projeto") return r;
    var root=findRoot(r,sm), ps=findParentSet(r,sm);
    return Object.assign({},r,{estruturaRaizSeq:root?root.seqOp:null,estruturaRaizDescricao:root?root.descricao:null,conjuntoPaiSeq:ps?ps.seqOp:null,conjuntoPaiDescricao:ps?ps.descricao:null});
  });
}
/* PARSERS */
function buildIdx(headers) { var m={}; headers.forEach(function(h,i){if(h!=null&&String(h).trim()!=="")m[normCol(h)]=i;}); return m; }
function findI(m) { for(var i=1;i<arguments.length;i++){var n=normCol(arguments[i]);if(m[n]!==undefined)return m[n];} return -1; }
function hasLeadIdx(rawH) { var v=String(rawH[0]||"").trim(); return v===""||v==="0"||/^\d+$/.test(v); }
function fixSheetRange(ws) {
  var cells=Object.keys(ws||{}).filter(function(k){return k.charAt(0)!=="!";});
  if(!cells.length)return ws;
  var range={s:{r:999999,c:999999},e:{r:0,c:0}};
  cells.forEach(function(k){
    var a=XLSX.utils.decode_cell(k);
    if(a.r<range.s.r)range.s.r=a.r;
    if(a.c<range.s.c)range.s.c=a.c;
    if(a.r>range.e.r)range.e.r=a.r;
    if(a.c>range.e.c)range.e.c=a.c;
  });
  ws["!ref"]=XLSX.utils.encode_range(range);
  return ws;
}
function sheetRows(data) {
  var wb=XLSX.read(data,{type:"array",cellDates:false});
  var ws=fixSheetRange(wb.Sheets[wb.SheetNames[0]]);
  return XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:""});
}

/* VALIDACAO DE ARQUIVO: recusa export errado explicando o motivo */
function requireCols(cm, tipo, obrig) {
  var faltando=[];
  obrig.forEach(function(o){
    var achou=o.alias.some(function(a){ return cm[normCol(a)]!==undefined; });
    if(!achou) faltando.push(o.nome);
  });
  if(faltando.length){
    var achadas=Object.keys(cm).slice(0,8).join(", ");
    throw new Error(
      "Este arquivo nao parece ser o export de "+tipo+". "+
      "Coluna(s) obrigatoria(s) ausente(s): "+faltando.join(", ")+". "+
      "Colunas encontradas no arquivo: "+(achadas||"nenhuma")+"."
    );
  }
}

function parseStructure(data, isXlsx) {
  var rows=[];
  if(isXlsx){
    rows=sheetRows(data);
  } else {
    rows=Papa.parse(data,{skipEmptyLines:true}).data;
  }
  if(!rows.length)return [];
  var ds=hasLeadIdx(rows[0])?1:0;
  var cm=buildIdx(rows[0].slice(ds));
  requireCols(cm,"ESTRUTURA DA OP",[
    {nome:"Seq.OP",alias:["seq.op","seqop","seq op"]},
    {nome:"Referencia",alias:["referencia","ref"]}
  ]);
  var iNro=findI(cm,"nro.op","nroop","nro op","op");
  var iSeq=findI(cm,"seq.op","seqop","seq op");
  var iOrig=findI(cm,"origem da sequencia","origemsequencia","origem");
  var iQtd=findI(cm,"qtd.da op","qtddaop","qtd op","quantidade");
  var iUn=findI(cm,"un","unidade");
  var iProd=findI(cm,"produto");
  var iRef=findI(cm,"referencia","referencia","ref");
  var iDesc=findI(cm,"desc.completa","desccompleta","descricao completa","descricao");
  var iCC=findI(cm,"cc andamento","ccandamento");
  var iCCP=findI(cm,"centros custo pendentes prod","centrospendentes");
  var iRefIn=findI(cm,"ref insumo","refinsumo","ref.insumo");
  var iDescIn=findI(cm,"desc.insumo","descinsumo","desc insumo");
  var iPos=findI(cm,"posicao","posicao","pos");
  function get(r,i){return i>=0?String(r[ds+i]||"").trim():"";}
  var parsed=[];
  for(var i=1;i<rows.length;i++){
    var r=rows[i];
    var nroOp=get(r,iNro),seqRaw=get(r,iSeq),origRaw=get(r,iOrig),referencia=get(r,iRef),descricao=get(r,iDesc);
    var seqOp=(seqRaw===""||seqRaw==="0")?null:(Number(seqRaw)||null);
    var origemSequencia=(origRaw===""||origRaw==="0")?null:(Number(origRaw)||null);
    if(!nroOp&&!seqOp&&!referencia&&!descricao)continue;
    var tipoRef=seqOp===null?"projeto":classifyRef(referencia);
    var refInsumo=get(r,iRefIn);
    parsed.push({nroOp:nroOp,seqOp:seqOp,origemSequencia:origemSequencia,qtdOp:normNum(get(r,iQtd)),unidade:get(r,iUn),produto:get(r,iProd),referencia:referencia,descricao:descricao,ccAndamento:get(r,iCC),centrosCustoPendentes:get(r,iCCP),refInsumo:refInsumo,descInsumo:get(r,iDescIn),unidadeInsumo:get(r,iUn),posicao:get(r,iPos),tipoReferencia:tipoRef,tipoInsumo:isSupply(refInsumo)?"suprimento":"outro",conjuntoPaiSeq:null,conjuntoPaiDescricao:null,estruturaRaizSeq:null,estruturaRaizDescricao:null});
  }
  return enrichRows(parsed);
}

function parsePurchase(data,isXlsx) {
  var rows=[];
  if(isXlsx){ rows=sheetRows(data); }
  else { rows=Papa.parse(data,{skipEmptyLines:true}).data; }
  if(!rows.length)return [];
  var ds=hasLeadIdx(rows[0])?1:0;
  var cm=buildIdx(rows[0].slice(ds));
  requireCols(cm,"REQUISICOES",[
    {nome:"Requisicao",alias:["requisicao","req"]},
    {nome:"Referencia",alias:["referencia produto","referenciaproduto","referencia","ref"]}
  ]);
  var iReq=findI(cm,"requisicao","requisicao","req");
  var iItem=findI(cm,"item");
  var iProd=findI(cm,"produto");
  var iDesc=findI(cm,"descricao do produto","descricaodoproduto","descricao produto","descricao");
  var iRef=findI(cm,"referencia produto","referenciaproduto","referencia","ref");
  var iQtd=findI(cm,"quantidade","qtd");
  var iUn=findI(cm,"un","unidade");
  var iDat=findI(cm,"data neces.","dataneces","data neces","data necessidade","data");
  var iSal=findI(cm,"qtd.saldo","qtdsaldo","saldo","qtd saldo");
  var iCC=findI(cm,"centro de custo","centrodecusto","cc");
  var iReq2=findI(cm,"requisitante");
  var iSit=findI(cm,"situacao","situacao");
  var iOri=findI(cm,"origem");
  var iFin=findI(cm,"finalidade da requisicao","finalidade");
  // Colunas de OC embutidas no arquivo unificado "Requisicoes e OCs" (opcionais)
  var iNumOc=findI(cm,"num.oc","numoc","num oc","nroc","nrooc");
  var iOcForn=findI(cm,"razao soc.longa","razaosoclonga","razao social longa","razao social","fornecedor");
  var iOcPos=findI(cm,"pos.ordem com","posordemcom","pos ordem com","posicao ordem","situacao oc");
  var iOcEntr=findI(cm,"menor dt.prazo entr","menordtprazoentr","menor prazo entrega","menor dt prazo entrega","prazo entrega");
  function get(r,i){return i>=0?(r[ds+i]==null?"":r[ds+i]):"";}
  function gs(r,i){return String(get(r,i)).trim();}
  var parsed=[];
  for(var i=1;i<rows.length;i++){
    var r=rows[i];
    var req=gs(r,iReq),ref=gs(r,iRef);
    if(!req&&!ref)continue;
    parsed.push({requisicao:req,item:gs(r,iItem),produto:gs(r,iProd),descricaoProduto:gs(r,iDesc),referenciaProduto:ref,quantidade:normNum(get(r,iQtd)),unidade:gs(r,iUn),dataNecessidade:parseXlDate(get(r,iDat)),qtdSaldo:normNum(get(r,iSal)),centroCusto:gs(r,iCC),requisitante:gs(r,iReq2),situacao:gs(r,iSit),origem:gs(r,iOri),finalidade:gs(r,iFin),numOc:iNumOc>=0?gs(r,iNumOc):"",ocFornecedorNome:iOcForn>=0?gs(r,iOcForn):"",ocPosicao:iOcPos>=0?gs(r,iOcPos):"",ocMenorEntrega:iOcEntr>=0?parseXlDate(get(r,iOcEntr)):null});
  }
  return parsed;
}
/* Deriva linhas de OC a partir do arquivo unificado de Requisicoes+OCs (quando presentes) */
function deriveOcFromPur(rows) {
  var comOc=rows.filter(function(r){return r.numOc;});

  return comOc.map(function(r){
    return {
      numOc:parseInt(String(r.numOc).replace(/\D/g,""))||0,
      numOcStr:String(r.numOc).trim(),
      item:r.item,
      referenciaProduto:r.referenciaProduto,
      descricaoProduto:r.descricaoProduto,
      quantidade:r.quantidade,
      fornecedorCod:"",
      fornecedorNome:r.ocFornecedorNome,
      dataEmissao:null,
      posicao:r.ocPosicao,
      comprador:"",
      transportador:"",
      menorEntrega:r.ocMenorEntrega,
      dtEntregaOriginal:r.ocMenorEntrega,
      dtNovaEntrega:null,
      prazo:"",
      vencimentos:"",
      valorTotal:0,
      origem:r.origem,
      _derived:true // veio do arquivo unificado; sem valor/emissao/comprador/transportador
    };
  });
}
/* ========= IMPORTACAO A PARTIR DO RELATORIO PCP MESTRE (SIGER) =========
   O export "RELATORIOS PCP.xlsx" traz varias OPs de uma vez, em abas
   diferentes da exportacao de Estrutura por OP usada ate aqui. Esta funcao
   reconstroi, para CADA OP presente no arquivo, o mesmo formato de linhas
   que parseStructure() gera a partir do export antigo - preservando a
   arvore Seq.OP x Origem Seq. (CJs pai/filho) usada na explosao do BOM -
   so que com dados mais completos: custo/qtd efetivos e a situacao real
   Sim/Nao de cada centro de custo, vinda da aba "CC PEND VS CONCL", ao
   inves do texto solto que a exportacao antiga trazia. */
function posicaoFromDescrPos(v) {
  var s=String(v||"").trim();
  if(/^n[aã]o\s*programada/i.test(s)) return "1 - "+s;
  if(/^totalmente programada/i.test(s)) return "3 - "+s;
  if(/^em produ/i.test(s)) return "4 - "+s;
  return s; /* "Encerrada" ja e reconhecida pelo texto (contem "encerr") */
}
function parseRelatoriosWorkbook(buf) {
  var wb=XLSX.read(buf,{type:"array",cellDates:false});
  if(wb.SheetNames.indexOf("ITENS OP CUSTO")<0){
    throw new Error("Este arquivo nao parece ser o Relatorio PCP (aba \"ITENS OP CUSTO\" nao encontrada). Colunas encontradas: "+wb.SheetNames.join(", "));
  }
  var itensRows=XLSX.utils.sheet_to_json(wb.Sheets["ITENS OP CUSTO"],{header:1,raw:true,defval:""});
  var ccRows=wb.SheetNames.indexOf("CC PEND VS CONCL")>=0?XLSX.utils.sheet_to_json(wb.Sheets["CC PEND VS CONCL"],{header:1,raw:true,defval:""}):[];
  if(!itensRows.length) throw new Error("Aba \"ITENS OP CUSTO\" vazia.");

  var cm=buildIdx(itensRows[0]);
  var iOp=findI(cm,"op"), iSeq=findI(cm,"seq.op","seqop"), iOrig=findI(cm,"origem seq.","origemseq","origem seq"),
      iPos=findI(cm,"descr.pos.op","descrposop"), iPCode=findI(cm,"produto"), iPRef=findI(cm,"ref produto","refproduto"),
      iPDesc=findI(cm,"desc.prod","descprod"), iPUn=findI(cm,"un"), iQtdProd=findI(cm,"qtd.produzir","qtdproduzir"),
      iICode=findI(cm,"cod.prod.item","codproditem"), iIDesc=findI(cm,"desc.item","descitem"),
      iIRef=findI(cm,"ref item","refitem");
  requireCols(cm,"RELATORIO PCP (aba ITENS OP CUSTO)",[
    {nome:"OP",alias:["op"]}, {nome:"Seq.OP",alias:["seq.op","seqop"]}, {nome:"Produto",alias:["produto"]}
  ]);
  /* "UN" aparece 2x no cabecalho (produto e item); a 2a ocorrencia e a do item */
  var unIdxs=[]; itensRows[0].forEach(function(h,i){ if(normCol(h)==="un") unIdxs.push(i); });
  var iIUn=unIdxs.length>1?unIdxs[1]:iPUn;
  if(unIdxs.length>0) iPUn=unIdxs[0];

  var cmCC=ccRows.length?buildIdx(ccRows[0]):{};
  var iCcOp=findI(cmCC,"op"), iCcSeq=findI(cmCC,"seq.op","seqop"),
      iCcDesc=findI(cmCC,"desc cc","desccc"), iCcEnc=findI(cmCC,"encerrado?","encerrado");

  /* mapa "OP|Seq.OP" -> lista de {ccDesc, encerrado} */
  var pendMap={};
  for(var i1=1;i1<ccRows.length;i1++){
    var rc=ccRows[i1]; var opc=String(rc[iCcOp]||"").trim();
    if(!opc) continue;
    var seqc=String(rc[iCcSeq]!==undefined&&rc[iCcSeq]!==""?rc[iCcSeq]:"0").trim();
    var keyc=opc+"|"+seqc;
    if(!pendMap[keyc]) pendMap[keyc]=[];
    pendMap[keyc].push({ccDesc:String(rc[iCcDesc]||"").trim(), encerrado:String(rc[iCcEnc]||"").trim()});
  }
  /* Devolve os centros de custo da posicao em 3 listas na ORDEM do relatorio:
     todos, so os pendentes e so os concluidos. Se o mesmo CC aparecer em mais
     de uma linha, basta uma dizer "Nao" para ele contar como pendente. */
  function centrosDe(op,seq){
    var lst=pendMap[op+"|"+seq];
    if(!lst) return {todos:"",pendentes:"",concluidos:""};
    var ordem=[], estado={};
    lst.forEach(function(c){
      if(!c.ccDesc) return;
      if(estado[c.ccDesc]===undefined){ ordem.push(c.ccDesc); estado[c.ccDesc]=true; }
      if(c.encerrado.toLowerCase()!=="sim") estado[c.ccDesc]=false;
    });
    return {
      todos:ordem.join(" / "),
      pendentes:ordem.filter(function(c){return !estado[c];}).join(" / "),
      concluidos:ordem.filter(function(c){return estado[c];}).join(" / ")
    };
  }

  /* agrupa ITENS OP CUSTO por OP -> por Seq.OP (posicao), guardando tambem
     quais codigos de produto tem posicao propria nesta OP (ja "explodidos"
     em outra linha da arvore - subconjuntos e pecas fabricadas) */
  var byOp={};
  for(var i2=1;i2<itensRows.length;i2++){
    var r=itensRows[i2];
    var op=String(r[iOp]||"").trim();
    if(!op) continue;
    if(!byOp[op]) byOp[op]={positions:{},hasOwnPosition:{}};
    var opData=byOp[op];
    var seqRaw=String(r[iSeq]!==undefined&&r[iSeq]!==""?r[iSeq]:"0").trim();
    if(!opData.positions[seqRaw]){
      opData.positions[seqRaw]={
        origemRaw:String(r[iOrig]!==undefined&&r[iOrig]!==""?r[iOrig]:"0").trim(),
        code:r[iPCode], ref:String(r[iPRef]||"").trim(), desc:String(r[iPDesc]||"").trim(),
        un:String(r[iPUn]||"").trim(), qtdProduzir:normNum(r[iQtdProd]), descrPos:String(r[iPos]||"").trim(),
        itens:[]
      };
    }
    if(r[iPCode]!==undefined && r[iPCode]!=="") opData.hasOwnPosition[String(r[iPCode])]=true;
    var itemCode=r[iICode];
    if(itemCode!==undefined && itemCode!==""){
      opData.positions[seqRaw].itens.push({code:String(itemCode), ref:String(r[iIRef]||"").trim(), desc:String(r[iIDesc]||"").trim(), un:String(r[iIUn]||"").trim()});
    }
  }

  var opsOut={};
  Object.keys(byOp).forEach(function(op){
    var opData=byOp[op];
    var positions=opData.positions, hasOwnPosition=opData.hasOwnPosition;
    var parsed=[];
    function nulSeq(rawVal){ return (rawVal===""||rawVal==="0")?null:(Number(rawVal)||null); }
    Object.keys(positions).forEach(function(seqRaw){
      var pos=positions[seqRaw];
      var seqOp=nulSeq(seqRaw);
      var origemSequencia=nulSeq(pos.origemRaw);
      var tipoRef=seqOp===null?"projeto":classifyRef(pos.ref);
      var posTxt=posicaoFromDescrPos(pos.descrPos);
      var cc=centrosDe(op,seqRaw), pendTxt=cc.pendentes;
      /* linha da propria posicao (uma unica por Seq.OP - preserva CJs pai/filho
         para a explosao do BOM exatamente como a exportacao antiga) */
      parsed.push({nroOp:op,seqOp:seqOp,origemSequencia:origemSequencia,qtdOp:pos.qtdProduzir,unidade:pos.un,
        produto:pos.code,referencia:pos.ref,descricao:pos.desc,ccAndamento:pendTxt,centrosCustoPendentes:pendTxt,
        centrosCustoTodos:cc.todos,centrosCustoConcluidos:cc.concluidos,
        refInsumo:"",descInsumo:"",unidadeInsumo:"",posicao:posTxt,tipoReferencia:tipoRef,tipoInsumo:"outro",
        conjuntoPaiSeq:null,conjuntoPaiDescricao:null,estruturaRaizSeq:null,estruturaRaizDescricao:null});
      /* itens consumidos que NAO tem posicao propria nesta OP viram folhas
         (materia-prima, pecas compradas prontas etc.), ligadas via Origem Seq.
         a posicao que as consome. Itens que JA tem posicao propria (subconjuntos,
         pecas fabricadas) nao geram linha extra aqui - a propria linha de
         posicao deles (com a Origem Seq. nativa do SIGER) ja faz esse vinculo. */
      var seen={};
      pos.itens.forEach(function(it){
        if(hasOwnPosition[it.code]) return;
        var dedupeKey=it.code+"|"+it.ref;
        if(seen[dedupeKey]) return; seen[dedupeKey]=1;
        var leafRef=it.ref||it.code;
        /* "referencia"/"descricao" da folha apontam para a POSICAO que consome o
           insumo (igual a exportacao de Estrutura por OP, onde a coluna
           Referencia e' a do item pai e Ref Insumo e' a do insumo). Isso mantem
           as colunas "Referencia" x "Ref Insumo" das abas Suprimentos e
           Integrado com o mesmo significado de antes.
           Ja "tipoReferencia" segue a classificacao do PROPRIO insumo, para as
           folhas nao inflarem as contagens de conjuntos/pecas fabricadas. */
        parsed.push({nroOp:op,seqOp:"ins_"+it.code+"@"+seqRaw,origemSequencia:seqOp,qtdOp:0,unidade:it.un,
          produto:it.code,referencia:pos.ref,descricao:pos.desc,ccAndamento:pendTxt,centrosCustoPendentes:"",
          centrosCustoTodos:cc.todos,centrosCustoConcluidos:cc.concluidos,
          refInsumo:leafRef,descInsumo:it.desc,unidadeInsumo:it.un,posicao:posTxt,tipoReferencia:classifyRef(leafRef),
          tipoInsumo:isSupply(leafRef)?"suprimento":"outro",conjuntoPaiSeq:null,conjuntoPaiDescricao:null,
          estruturaRaizSeq:null,estruturaRaizDescricao:null});
      });
    });
    var rows=enrichRows(parsed);
    var proj=rows.find(function(r){return r.tipoReferencia==="projeto";});
    opsOut[op]={opId:op,name:proj?(proj.descricao||String(proj.produto)||("OP "+op)):("OP "+op),rows:rows,totalItens:rows.length};
  });
  return opsOut;
}

function calcPendingCenters(str,intr) {
  var m={};
  str.forEach(function(r){
    splitPendingCenters(r.centrosCustoPendentes).forEach(function(cc){
      if(!m[cc])m[cc]={centro:cc,itens:0,naoProgramados:0,emProducao:0,suprimentos:0,semOc:0,ops:{},conjuntos:{},score:0};
      var it=m[cc]; it.itens++; it.score++;
      if(posCode(r.posicao)==="1"){it.naoProgramados++;it.score+=4;}
      if(posCode(r.posicao)==="4"){it.emProducao++;it.score+=2;}
      if(r.tipoInsumo==="suprimento"){it.suprimentos++;it.score+=2;}
      if(r.nroOp)it.ops[r.nroOp]=1;
      if(r.conjuntoPaiDescricao)it.conjuntos[r.conjuntoPaiDescricao]=1;
    });
  });
  intr.filter(function(r){return r.tipoInsumo==="suprimento"&&!r.possuiOc;}).forEach(function(r){
    splitPendingCenters(r.centrosCustoPendentes).forEach(function(cc){
      if(!m[cc])m[cc]={centro:cc,itens:0,naoProgramados:0,emProducao:0,suprimentos:0,semOc:0,ops:{},conjuntos:{},score:0};
      m[cc].semOc++; m[cc].score+=5;
    });
  });
  return Object.values(m).map(function(x){
    x.opsCount=Object.keys(x.ops).length; x.conjuntosCount=Object.keys(x.conjuntos).length;
    x.risco=x.semOc>0||x.naoProgramados>0?"critico":x.emProducao>0?"atencao":"normal";
    return x;
  }).sort(function(a,b){return b.score-a.score;});
}
function calcPendingQueue(str,intr) {
  var semOc={};
  intr.filter(function(r){return r.tipoInsumo==="suprimento"&&!r.possuiOc;}).forEach(function(r){semOc[(r.seqOp||"")+"|"+(r.refInsumo||"")]=1;});

    var key=(r.seqOp||"")+"|"+(r.refInsumo||"");
    return Object.assign({},r,{centrosPendentesLista:splitPendingCenters(r.centrosCustoPendentes).join(" / "),severidade:pendingSeverity(r),bloqueioMaterial:!!semOc[key]});
  }).sort(function(a,b){

    sa+=splitPendingCenters(a.centrosCustoPendentes).length*3+(posCode(a.posicao)==="1"?10:0);
    sb+=splitPendingCenters(b.centrosCustoPendentes).length*3+(posCode(b.posicao)==="1"?10:0);

function calcTopSup(str,intr) {

/* INDEXEDDB - Persistencia entre sessoes */
var PCP_DB="painel-pcp-db";
var IDB_OK=true;
function idbOpen(cb){
  if(!IDB_OK){ cb(new Error("IndexedDB indisponivel"),null); return; }
  try{
    if(typeof indexedDB==="undefined"||!indexedDB){ IDB_OK=false; cb(new Error("IndexedDB indisponivel"),null); return; }
    var req=indexedDB.open(PCP_DB,2);
    req.onupgradeneeded=function(e){
      var db=e.target.result;
      if(!db.objectStoreNames.contains("files")) db.createObjectStore("files");
      if(!db.objectStoreNames.contains("pdfs")) db.createObjectStore("pdfs");
      if(!db.objectStoreNames.contains("settings")) db.createObjectStore("settings");
    };
    req.onsuccess=function(e){ cb(null,e.target.result); };
    req.onerror=function(){ cb(req.error||new Error("Falha ao abrir cache"),null); };
    req.onblocked=function(){ cb(new Error("Cache bloqueado por outra aba aberta"),null); };
  }catch(e){ IDB_OK=false; cb(e,null); }
}
function idbSaveSetting(key,data,cb){
  idbOpen(function(err,db){
    if(err){if(cb)cb();return;}
    try{
      var tx=db.transaction("settings","readwrite");
      tx.objectStore("settings").put(data,key);
      tx.oncomplete=function(){if(cb)cb();};
      tx.onerror=function(){if(cb)cb();};
    }catch(e){if(cb)cb();}
  });
}
function idbLoadSetting(key,cb){
  idbOpen(function(err,db){
    if(err){cb(null);return;}
    var tx=db.transaction("settings","readonly");
    var req=tx.objectStore("settings").get(key);
    req.onsuccess=function(){cb(req.result||null);};
    req.onerror=function(){cb(null);};
  });
}
function idbSave(key,file,cb){
  file.arrayBuffer().then(function(buf){
    idbOpen(function(err,db){
      if(err){if(cb)cb(err);return;}
      try{
        var tx=db.transaction("files","readwrite");
        tx.objectStore("files").put({name:file.name,mime:file.type,data:buf,ts:new Date().toISOString()},key);
        tx.oncomplete=function(){if(cb)cb(null);};
        tx.onerror=function(){if(cb)cb(tx.error);};
      }catch(e){if(cb)cb(e);}
    });
  }).catch(function(e){if(cb)cb(e);});
}
function idbLoad(key,cb){
  idbOpen(function(err,db){
    if(err){cb(null,null);return;}
    var tx=db.transaction("files","readonly");
    var req=tx.objectStore("files").get(key);
    req.onsuccess=function(){
      var r=req.result;
      if(!r){cb(null,null);return;}
      var blob=new Blob([r.data],{type:r.mime||"application/octet-stream"});
      cb(null,new File([blob],r.name,{type:r.mime}),r.ts);
    };
    req.onerror=function(){cb(null,null);};
  });
}
function idbSavePDFs(files,cb){
  var arr=Array.from(files).filter(function(f){return /\.pdf$/i.test(f.name);});
  idbOpen(function(err,db){
    if(err){if(cb)cb();return;}
    var clr=db.transaction("pdfs","readwrite");
    clr.objectStore("pdfs").clear();
    clr.oncomplete=function(){
      if(!arr.length){if(cb)cb();return;}
      var done=0;
      arr.forEach(function(f){
        f.arrayBuffer().then(function(buf){
          try{
            var tx=db.transaction("pdfs","readwrite");
            tx.objectStore("pdfs").put({name:f.name,mime:f.type,data:buf},f.name);
            tx.oncomplete=function(){done++;if(done===arr.length&&cb)cb();};
            tx.onerror=function(){done++;if(done===arr.length&&cb)cb();};
          }catch(e){done++;if(done===arr.length&&cb)cb();}
        }).catch(function(){done++;if(done===arr.length&&cb)cb();});
      });
    };
    clr.onerror=function(){if(cb)cb();};
  });
}
function idbLoadPDFs(cb){

function idbDumpSettings(cb){
  idbOpen(function(err,db){
    if(err){cb({});return;}
    try{
      var tx=db.transaction("settings","readonly");
      var st=tx.objectStore("settings");
      var rk=st.getAllKeys(), rv=st.getAll();
      var keys=null,vals=null;
      function done(){
        if(keys===null||vals===null) return;
        var out={};
        for(var i=0;i<keys.length;i++) out[keys[i]]=vals[i];
        cb(out);
      }
      rk.onsuccess=function(){keys=rk.result||[];done();};
      rv.onsuccess=function(){vals=rv.result||[];done();};
      rk.onerror=function(){cb({});};
      rv.onerror=function(){cb({});};
    }catch(e){cb({});}
  });
}
function idbRestoreSettings(map,cb){
  var keys=Object.keys(map||{});
  if(!keys.length){ if(cb)cb(); return; }
  var done=0;
  keys.forEach(function(k){
    idbSaveSetting(k,map[k],function(){ done++; if(done===keys.length&&cb) cb(); });
  });
}
function idbClear(cb){
  idbOpen(function(err,db){
    if(err){if(cb)cb();return;}
    var tx=db.transaction(["files","pdfs"],"readwrite");
    tx.objectStore("files").clear();
    tx.objectStore("pdfs").clear();
    tx.oncomplete=function(){if(cb)cb();};
    tx.onerror=function(){if(cb)cb();};
  });
}

// Converte Firestore Timestamp (tem metodo toDate) OU string ISO (vindo de backup antigo) em Date real.
function fbToDate(v){
  if(!v) return null;
  if(typeof v.toDate==="function") return v.toDate();
  if(v instanceof Date) return v;
  var d=new Date(v);
  return isNaN(d.getTime())?null:d;
}

var FB_CHUNK_SIZE=400;
function fbChunkArray(arr){
  var out=[];
  for(var i=0;i<arr.length;i+=FB_CHUNK_SIZE) out.push(arr.slice(i,i+FB_CHUNK_SIZE));
  return out;
}

// Executa uma lista de operacoes (set/delete) em lotes de ate 400 (limite do Firestore e 500 por batch)
function fbCommitOps(ops,cb){
  var GROUP=400, i=0;
  function next(){
    if(i>=ops.length){ if(cb) cb(); return; }
    var batch=fbDb.batch();
    var end=Math.min(i+GROUP,ops.length);
    for(var j=i;j<end;j++){
      var o=ops[j];
      if(o.type==="set") batch.set(o.ref,o.data); else batch.delete(o.ref);
    }
    i=end;
    batch.commit().then(next).catch(function(e){ console.error("Firestore - erro ao gravar:",e); if(cb) cb(e); });
  }
  next();
}

// Grava um array (potencialmente grande) em documentos de ate 400 linhas cada,
// numerados "0","1","2"... e apaga sobras de uma gravacao anterior maior.
function fbSaveChunks(collPath,rows,cb){
  if(!FB_OK){ if(cb) cb(); return; }
  fbAuthReady.then(function(){
    var col=fbDb.collection(collPath);
    col.get().then(function(snap){
      var chunks=fbChunkArray(rows);
      var ops=[];
      chunks.forEach(function(chunk,idx){ ops.push({type:"set",ref:col.doc(String(idx)),data:{rows:chunk}}); });
      snap.forEach(function(doc){
        var idx=parseInt(doc.id,10);
        if(isNaN(idx)||idx>=chunks.length) ops.push({type:"delete",ref:doc.ref});
      });
      fbCommitOps(ops,cb);
    }).catch(function(e){ console.error("Firestore - erro ao ler antes de gravar ("+collPath+"):",e); if(cb) cb(e); });
  }).catch(function(e){ if(cb) cb(e); });
}

// Escuta em tempo real uma colecao de chunks e devolve o array remontado (na ordem 0,1,2...)
function fbWatchChunks(collPath,onRows){
  if(!FB_OK) return function(){};
  var unsub=null, cancelled=false;
  fbAuthReady.then(function(){
    if(cancelled) return;
    unsub=fbDb.collection(collPath).onSnapshot(function(snap){
      var docs=[];
      snap.forEach(function(doc){ docs.push({id:parseInt(doc.id,10),rows:(doc.data()&&doc.data().rows)||[]}); });
      docs.sort(function(a,b){return a.id-b.id;});
      var all=[];
      docs.forEach(function(d){ all=all.concat(d.rows); });
      onRows(all,snap.metadata.hasPendingWrites);
    },function(e){ console.error("Firestore - erro ao observar ("+collPath+"):",e); });
  });
  return function(){ cancelled=true; if(unsub) unsub(); };
}

// Documento pequeno com metadados: lista de OPs (sem as linhas), nomes de arquivo.
function fbSaveMeta(data,cb){
  if(!FB_OK){ if(cb) cb(); return; }
  fbAuthReady.then(function(){
    var payload=Object.assign({},data,{updatedAt:firebase.firestore.FieldValue.serverTimestamp()});
    fbDb.doc("workspaces/"+WORKSPACE_ID).set(payload,{merge:true}).then(function(){ if(cb) cb(); })
      .catch(function(e){ console.error("Firestore - erro ao gravar metadados:",e); if(cb) cb(e); });
  }).catch(function(e){ if(cb) cb(e); });
}
function fbWatchMeta(onData){
  if(!FB_OK) return function(){};
  var unsub=null, cancelled=false;
  fbAuthReady.then(function(){
    if(cancelled) return;
    unsub=fbDb.doc("workspaces/"+WORKSPACE_ID).onSnapshot(function(doc){
      if(doc.exists) onData(doc.data(),doc.metadata.hasPendingWrites);
    },function(e){ console.error("Firestore - erro ao observar metadados:",e); });
  });
  return function(){ cancelled=true; if(unsub) unsub(); };
}

  var loadPdfFolder=useCallback(function(files){
    var idx={};
    var total=0;
    Array.from(files).forEach(function(f){
      if(!/\.pdf$/i.test(f.name)) return;
      total++;
      var nameNoExt=f.name.replace(/\.pdf$/i,"").trim();
      var codes=[];
      // Padrao 1: referencia SEGMENTADA no nome do arquivo, ex: "8_81_01_013" ou "8.81.01.013"
      // (formato usado nos desenhos Tecnodrill: REFERENCIA: 8.81.01.013 -> arquivo 8_81_01_013 - DESCRICAO.pdf)
      var segRe=/(\d{1,2})[_.](\d{2})[_.](\d{2})[_.](\d{3})/g;
      var segMatch;
      while((segMatch=segRe.exec(nameNoExt))!==null){
        codes.push(segMatch[1]+segMatch[2]+segMatch[3]+segMatch[4]);
      }
      // Padrao 2: bloco de 6 a 12 digitos consecutivos (ex: "88101013 - PECA.pdf")
      var blockMatches=nameNoExt.match(/\d{6,12}/g);
      if(blockMatches){
        blockMatches.forEach(function(code){

      if(codes.length){
        codes.forEach(function(code){ idx[code]=f; });

    });

    idbLoad("ocs",function(err,file){

  useEffect(function(){

      });
      setOps(newOps);
      var cur=activeOpIdRef.current;
      var keys=Object.keys(newOps);

      setActiveOpId(nextActive);
      if(nextActive){
        setStrRows(newOps[nextActive].rows); setStrFile(newOps[nextActive].file); setProj(newOps[nextActive].proj);

    var unsubMeta=fbWatchMeta(function(data,pending){

/* LAYOUT DE COLUNAS - funcao pura.
   Contrato de estabilidade entre versoes do sistema:
   - coluna NOVA no codigo  -> aparece no fim, sem quebrar a ordem salva
   - coluna REMOVIDA        -> ignorada; a chave fica guardada (colunas de OC/PDF so existem
                               quando o arquivo esta carregado, entao NUNCA podar chaves)
   - coluna RENOMEADA       -> tratada como nova; o resto do layout permanece
   - nunca devolve lista vazia (garante ao menos 1 coluna visivel) */
function applyColLayout(cols, order, hidden){
  var base=(cols||[]).slice();
  hidden=hidden||{};
  if(Array.isArray(order) && order.length){
    var pos={};
    base.forEach(function(c,i){ pos[c.key||c.label]=i; });
    var usadas={}, ordenadas=[];
    order.forEach(function(k){
      var i=pos[k];
      if(i!==undefined && !usadas[k]){ usadas[k]=1; ordenadas.push(base[i]); }
    });
    base.forEach(function(c){
      var k=c.key||c.label;
      if(!usadas[k]) ordenadas.push(c);   // coluna nova (versao mais recente do sistema)
    });
    base=ordenadas;
  }
  var visiveis=base.filter(function(c){ return !hidden[c.key||c.label]; });
  return visiveis.length ? visiveis : base;  // trava: nunca deixa a tabela sem colunas
}

              {c.render?c.render(row):(c.get?c.get(row):(row[c.key]==null?"--":row[c.key]))}
            </td>;})}</tr>;
          })}
        </tbody>
      </table>
    </div>
    {pages>1&&<div className="flex items-center justify-between text-xs text-slate-500">
      <button disabled={curPg===0} onClick={function(){setPg(function(p){return Math.max(0,p-1);});}} className="px-2 py-1 bg-slate-700 rounded disabled:opacity-30">Ant</button>

  </div>;
}


/* CHARTS - SVG nativo, sem dependencias externas */
var COLORS=["#60a5fa","#34d399","#fb923c","#818cf8","#f472b6","#facc15","#2dd4bf","#f87171"];

/* Tooltip flutuante */
function useTooltip() {
  var _t=useState(null), tip=_t[0], setTip=_t[1];
  function show(e,content){ setTip({x:e.clientX,y:e.clientY,content:content}); }
  function hide(){ setTip(null); }
  var el = tip ? <div style={{position:"fixed",left:tip.x+12,top:tip.y-8,background:"#1e293b",border:"1px solid #334155",borderRadius:"8px",padding:"6px 10px",fontSize:"12px",color:"#e2e8f0",pointerEvents:"none",zIndex:1000,whiteSpace:"nowrap"}}>{tip.content}</div> : null;
  return {show:show,hide:hide,el:el};
}

/* DONUT SVG */
function Donut(props) {
  var data=props.data, title=props.title;
  var tip=useTooltip();
  if(!data||!data.length) return <div className="text-slate-500 text-sm py-4 text-center">Sem dados</div>;
  var total=data.reduce(function(s,d){return s+d.value;},0);
  if(!total) return <div className="text-slate-500 text-sm py-4 text-center">Sem dados</div>;
  var cx=75,cy=75,ro=60,ri=38;
  var angle=-Math.PI/2, arcs=[];
  data.forEach(function(d,i){
    var a=(d.value/total)*2*Math.PI;
    var x1=cx+ro*Math.cos(angle), y1=cy+ro*Math.sin(angle);
    var x2=cx+ro*Math.cos(angle+a), y2=cy+ro*Math.sin(angle+a);
    var ix1=cx+ri*Math.cos(angle), iy1=cy+ri*Math.sin(angle);
    var ix2=cx+ri*Math.cos(angle+a), iy2=cy+ri*Math.sin(angle+a);
    var large=a>Math.PI?1:0;
    var path="M "+x1+" "+y1+" A "+ro+" "+ro+" 0 "+large+" 1 "+x2+" "+y2+" L "+ix2+" "+iy2+" A "+ri+" "+ri+" 0 "+large+" 0 "+ix1+" "+iy1+" Z";
    var pct=Math.round(d.value/total*100);
    arcs.push({path:path,color:d.color||COLORS[i%COLORS.length],name:d.name,value:d.value,pct:pct});
    angle+=a;
  });
  return <div className="flex flex-col gap-2">
    {title&&<div className="text-sm font-semibold text-slate-300">{title}</div>}
    {tip.el}
    <div className="flex gap-4 items-center flex-wrap">
      <svg width="150" height="150" style={{flexShrink:0}}>
        {arcs.map(function(a,i){return <path key={i} d={a.path} fill={a.color} stroke="#1e293b" strokeWidth="1.5"
          onMouseMove={function(e){tip.show(e,a.name+": "+a.value+" ("+a.pct+"%)");}} onMouseLeave={tip.hide}/>;})}</svg>
      <div className="flex flex-col gap-1.5 flex-1 min-w-28">
        {data.map(function(d,i){return <div key={i} className="flex items-center gap-2 text-xs">
          <span className="w-2.5 h-2.5 rounded-full flex-shrink-0" style={{background:d.color||COLORS[i%COLORS.length]}}/>
          <span className="text-slate-300 flex-1">{d.name}</span>
          <span className="mono text-slate-400">{d.value}</span>
        </div>;})}
        <div className="flex items-center gap-2 text-xs border-t border-slate-700 pt-1 mt-0.5">
          <span className="text-slate-400 flex-1">Total</span><span className="mono text-white font-bold">{total}</span>
        </div>
      </div>
    </div>
  </div>;
}

/* HBAR SVG */
function HBar(props) {
  var data=props.data, vk=props.vk, nk=props.nk||"name", title=props.title, color=props.color||"#60a5fa";
  var tip=useTooltip();
  if(!data||!data.length) return <div className="text-slate-500 text-sm py-4 text-center">Sem dados</div>;
  var max=Math.max.apply(null,data.map(function(d){return d[vk]||0;}));
  if(!max) max=1;
  var W=360, barH=20, gap=8, labelW=130, numW=50, padL=8, padR=8;
  var rowH=barH+gap;
  var svgH=data.length*rowH+16;
  var barW=W-labelW-numW-padL-padR;
  return <div className="flex flex-col gap-2">
    {title&&<div className="text-sm font-semibold text-slate-300">{title}</div>}
    {tip.el}
    <div className="overflow-x-auto">
      <svg width={W} height={svgH}>
        {data.map(function(d,i){
          var y=i*rowH+8;
          var val=d[vk]||0;

/* COVBAR SVG */

/* PARSER ARQUIVO OC */
function parseOcFile(data,isXlsx) {
  var rows=[];
  if(isXlsx){
    var wb=XLSX.read(data,{type:"array",cellDates:false});
    var ws=wb.Sheets[wb.SheetNames[0]];
    rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:""});
  } else {
    rows=Papa.parse(data,{skipEmptyLines:true}).data;
  }
  if(!rows.length) return [];
  var ds=hasLeadIdx(rows[0])?1:0;
  var cm=buildIdx(rows[0].slice(ds));
  requireCols(cm,"ITENS DE OC",[
    {nome:"Num.OC",alias:["num.oc","numoc","num oc","nroc"]},
    {nome:"Referencia",alias:["referencia","referencia produto","referenciaproduto"]}
  ]);
  var iNum=findI(cm,"num.oc","numoc","num oc","numeroc","numero oc","nroc");
  var iForn=findI(cm,"fornecedor");
  var iRaz=findI(cm,"razao social do fornecedor","razaosocialdofornecedor","razao social","fornecedor nome");
  var iEm=findI(cm,"data emissao","dataemissao","emissao","data de emissao");
  var iPos=findI(cm,"posicao","situacao","pos");
  var iComp=findI(cm,"comprador");
  var iTransp=findI(cm,"transportador");
  // Dt.Entrega: normCol = "dtentrega" | Menor entrega = "menorentrega" | entrega = "entrega"
  var iEntrega=findI(cm,"dtentrega","dt.entrega","menor entrega","menorentrega","prazo entrega","prazoentrega","data entrega","entrega");
  // Nova Dt.Entrega: data de entrega revisada (se preenchida, prevalece)
  var iNovaEntrega=findI(cm,"novadtentrega","nova dt.entrega","nova entrega","novaentrega","novodt","nova data entrega");
  var iPrazo=findI(cm,"prazo");
  var iVenc=findI(cm,"vencimentos");
  var iValor=findI(cm,"valor total","valortotal","valor","valor unit");
  var iOrig=findI(cm,"origem");
  var iRef=findI(cm,"referencia produto","referenciaproduto","referencia","ref produto","codigo produto","codproduto");
  // Descricao do produto: tenta "descricao do produto" e variantes
  var iDesc=findI(cm,"descricao do produto","descricaodoproduto","descricao produto","descricaoproduto","descricao","descricao item");
  var iQtd=findI(cm,"quantidade","qtd","qtdoc","qtd oc");
  var iItem=findI(cm,"item","itemoc","item oc");
  function get(r,i){return i>=0?(r[ds+i]==null?"":r[ds+i]):""}
  function gs(r,i){return String(get(r,i)).trim();}
  var parsed=[];
  for(var i=1;i<rows.length;i++){
    var r=rows[i];
    var numOc=get(r,iNum);
    if(!numOc&&numOc!==0) continue;
    var numOcStr=String(numOc).trim();
    if(!numOcStr||numOcStr==="") continue;
    // Prazo de entrega: usa Nova Dt.Entrega se preenchida, senao Dt.Entrega
    var dtEntrega=parseXlDate(get(r,iEntrega));
    var dtNovaEntrega=iNovaEntrega>=0?parseXlDate(get(r,iNovaEntrega)):null;
    var prazoEntrega=dtNovaEntrega||dtEntrega;
    parsed.push({
      numOc:parseInt(numOcStr)||0,
      numOcStr:numOcStr,
      item:iItem>=0?gs(r,iItem):"",
      referenciaProduto:iRef>=0?gs(r,iRef):"",
      descricaoProduto:iDesc>=0?gs(r,iDesc):"",
      quantidade:iQtd>=0?normNum(get(r,iQtd)):0,
      fornecedorCod:gs(r,iForn),
      fornecedorNome:gs(r,iRaz),
      dataEmissao:parseXlDate(get(r,iEm)),
      posicao:gs(r,iPos),
      comprador:gs(r,iComp),
      transportador:gs(r,iTransp),
      menorEntrega:prazoEntrega,
      dtEntregaOriginal:dtEntrega,
      dtNovaEntrega:dtNovaEntrega,
      prazo:gs(r,iPrazo),
      vencimentos:gs(r,iVenc),
      valorTotal:normNum(get(r,iValor)),
      origem:gs(r,iOrig)
    });
  }
  return parsed;
}

}

function UploadPanel() {

            <span className="text-xs text-slate-600 mono">{op.rows.length} itens</span>

            <button onClick={function(){app.removeOp(op.opId);}} className="text-xs px-1.5 py-0.5 bg-slate-700 hover:bg-rose-900/50 rounded text-slate-500 hover:text-rose-400">x</button>

}


/* Icone fechar */
Ic.X=function(p){return <svg width={p.s||16} height={p.s||16} viewBox="0 0 24 24" fill="none" stroke={p.c||"currentColor"} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>;};

/* SLOT PASTA DE PDFs */
function PdfFolderSlot() {
  var app=useApp();
  var ref=useRef();
  var total=app.pdfTotal||0;
  var pdfKeys=Object.keys(app.pdfIndex);
  var codeKeys=pdfKeys.filter(isPdfRefCode);
  var rawEntries=pdfKeys.filter(function(k){return !isPdfRefCode(k);}).map(function(k){return app.pdfIndex[k]&&app.pdfIndex[k].name||k;});
  var indexed=codeKeys.length;
  var hasFiles=total>0;
  var noMatch=total>0&&indexed===0;
  var hasUnrecognized=rawEntries.length>0;
  var borderCls=hasFiles
    ?(indexed>0?"border-violet-500/50 bg-violet-900/10":"border-amber-500/50 bg-amber-900/10")
    :"border-slate-600 hover:border-violet-500/50 hover:bg-violet-900/5";
  return <div className="flex-1 min-w-52">
    <div className="text-xs font-semibold text-slate-400 uppercase tracking-wide mb-2 flex items-center gap-1.5">
      <Ic.File s={12}/>Desenhos (PDF)
    </div>
    <div onClick={function(){ref.current.click();}}
      className={"border-2 border-dashed rounded-xl p-4 cursor-pointer flex flex-col items-center gap-2 text-center "+borderCls}>
      {!hasFiles&&<><Ic.File s={18} c="#64748b"/><span className="text-xs text-slate-400">Selecionar PDFs dos desenhos</span><span className="text-xs text-slate-600">Pecas (01) e conjuntos (50)</span></>}
      {hasFiles&&indexed>0&&<><Ic.Ok s={18} c="#a78bfa"/><span className="text-xs text-violet-400 font-medium">{total} PDF{total>1?"s":""} carregado{total>1?"s":""}</span><span className="text-xs text-slate-400">{indexed} codigo{indexed>1?"s":""} reconhecido{indexed>1?"s":""}</span><span className="text-xs text-slate-500">Clique para recarregar</span></>}
      {hasFiles&&indexed===0&&<><Ic.Warn s={18} c="#f59e0b"/><span className="text-xs text-amber-400 font-medium">{total} arquivo{total>1?"s":""} recebido{total>1?"s":""}</span><span className="text-xs text-amber-600">0 codigos reconhecidos nos nomes</span></>}
    </div>
    {hasUnrecognized&&<div className="mt-2 px-3 py-2 bg-amber-900/20 border border-amber-500/30 rounded-lg text-left">
      <div className="flex items-center gap-1.5 text-xs text-amber-400 font-semibold mb-1"><Ic.Warn s={11}/>{rawEntries.length} arquivo{rawEntries.length>1?"s":""} sem codigo reconhecido no nome</div>
      <div className="flex flex-col gap-0.5 max-h-24 overflow-y-auto">
        {rawEntries.slice(0,8).map(function(name,i){return <div key={i} className="text-xs text-amber-600/90 mono truncate">{name}</div>;})}
        {rawEntries.length>8&&<div className="text-xs text-amber-700">+{rawEntries.length-8} outro(s) - veja em Relatorios</div>}
      </div>
    </div>}
    <input ref={ref} type="file" accept=".pdf" multiple className="hidden"
      onChange={function(e){if(e.target.files&&e.target.files.length)app.loadPdfFolder(e.target.files);e.target.value="";}}/>
    {!hasFiles&&<p className="text-xs text-slate-600 mt-1 text-center">Dica: selecione todos os PDFs de uma vez (Ctrl+A)</p>}
    {noMatch&&<p className="text-xs text-amber-700 mt-1 text-center">O nome do arquivo deve conter o codigo numerico. Ex: 95701344.pdf ou 95701344 - PECA.pdf</p>}
  </div>;
}

/* SLOT ARQUIVO OC */
function OcFileSlot() {

    </div>
    <input ref={ref} type="file" accept=".csv,.xlsx,.xls" className="hidden"

/* DASHBOARD OC / FORNECEDORES */
function DashOcDetails() {
  var app=useApp();
  var _fPos=useState("all"), fPos=_fPos[0], setFPos=_fPos[1];
  var _fComp=useState("all"), fComp=_fComp[0], setFComp=_fComp[1];
  var _fOrig=useState("all"), fOrig=_fOrig[0], setFOrig=_fOrig[1];

  var compList=useMemo(function(){var s={};app.ocRows.forEach(function(r){if(r.comprador)s[r.comprador]=1;});return Object.keys(s).sort();},[app.ocRows]);

  var filtered=useMemo(function(){
    var d=app.ocRows;
    if(fPos!=="all") d=d.filter(function(r){return r.posicao===fPos;});
    if(fComp!=="all") d=d.filter(function(r){return r.comprador===fComp;});
    if(fOrig!=="all") d=d.filter(function(r){return r.origem===fOrig;});
    return d;
  },[app.ocRows,fPos,fComp,fOrig]);

  if(!app.ocRows.length) return <div className="p-6">
    <Empty Icon={Ic.Cart} title="Arquivo OC nao carregado" desc="Carregue o arquivo de OC / Fornecedores no painel de upload"/>
  </div>;

  // KPIs
  var emitidas=app.ocRows.filter(function(r){return r.posicao==="2-Emitida";});
  var entregues=app.ocRows.filter(function(r){return r.posicao==="4-Entregue";});
  var parciais=app.ocRows.filter(function(r){return r.posicao==="3-Parcialmente entregue";});
  var valorTotal=app.ocRows.reduce(function(s,r){return s+r.valorTotal;},0);
  var valorPendente=emitidas.reduce(function(s,r){return s+r.valorTotal;},0);
  var vencidas=emitidas.filter(function(r){return isPast(r.menorEntrega);});

  // Ranking fornecedores
  var fornMap={};
  app.ocRows.forEach(function(r){
    var k=r.fornecedorNome||r.fornecedorCod||"?";
    if(!fornMap[k]) fornMap[k]={nome:k,cod:r.fornecedorCod,count:0,valor:0,pendente:0};
    fornMap[k].count++;
    fornMap[k].valor+=r.valorTotal;
    if(r.posicao==="2-Emitida") fornMap[k].pendente+=r.valorTotal;
  });
  var fornRank=Object.values(fornMap).sort(function(a,b){return b.pendente-a.pendente;}).slice(0,8);

  var COL_OC_DET=[
    {key:"numOcStr",label:"Num. OC",cls:"mono text-xs font-semibold"},
    {key:"fornecedorNome",label:"Fornecedor",cls:"text-xs max-w-xs truncate"},
    {key:"posicao",label:"Situacao",ns:true,render:function(r){
      var col=r.posicao==="2-Emitida"?"bg-blue-500/20 text-blue-300 border-blue-500/30":r.posicao==="4-Entregue"?"bg-emerald-500/20 text-emerald-300 border-emerald-500/30":"bg-orange-500/20 text-orange-300 border-orange-500/30";
      return <span className={"px-2 py-0.5 rounded text-xs font-medium border "+col}>{r.posicao}</span>;
    },get:function(r){return r.posicao;}},
    {key:"menorEntrega",label:"Prazo Entrega",cls:"mono text-xs",render:function(r){
      var past=isPast(r.menorEntrega)&&r.posicao==="2-Emitida";
      return <span className={past?"text-rose-400 font-semibold":""}>{fmtDate(r.menorEntrega)}</span>;
    },get:function(r){return fmtDate(r.menorEntrega);}},
    {key:"origem",label:"Origem",cls:"text-xs max-w-xs truncate"},
  ].concat(app.hasOcFinance?[
    {key:"dataEmissao",label:"Emissao",cls:"mono text-xs",get:function(r){return fmtDate(r.dataEmissao);}},
    {key:"prazo",label:"Cond.Pgto",cls:"text-xs"},
    {key:"valorTotal",label:"Valor Total",cls:"mono text-xs text-right",get:function(r){return fmtNum(r.valorTotal);}},
    {key:"comprador",label:"Comprador",cls:"text-xs"},
    {key:"transportador",label:"Transportador",cls:"text-xs"},
  ]:[]);

  return <div className="p-6 flex flex-col gap-4">
    <div className="flex items-center gap-3 flex-wrap">
      <h2 className="text-lg font-bold text-white flex items-center gap-2"><Ic.Cart s={17}/>OC / Fornecedores</h2>
      <span className="text-xs text-slate-500 bg-slate-800 px-2 py-0.5 rounded mono">{app.ocRows.length} OCs</span>
    </div>

    {/* KPIs */}
    <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
      <KPI icon={Ic.Cart} label="Emitidas (abertas)" value={emitidas.length} g="blue" sm/>
      <KPI icon={Ic.Ok} label="Entregues" value={entregues.length} g="emerald" sm/>
      <KPI icon={Ic.Warn} label="Parc. Entregues" value={parciais.length} g="amber" sm/>
      <KPI icon={Ic.Clock} label="Vencidas em aberto" value={vencidas.length} g="rose" sm/>
    </div>
    {!app.hasOcFinance&&<Alert type="info" msg="Valor, comprador, transportador e data de emissao nao vem no arquivo unificado de Requisicoes + OCs. Para ve-los, carregue tambem o arquivo OC / Fornecedores original (SIGER) no painel de upload."/>}
    {app.hasOcFinance&&<div className="grid grid-cols-2 md:grid-cols-2 gap-3">
      <KPI icon={Ic.Bar} label="Valor Total OCs" value={"R$ "+fmtNum(valorTotal)} g="slate" sm/>
      <KPI icon={Ic.Warn} label="Valor Pendente (abertas)" value={"R$ "+fmtNum(valorPendente)} g="rose" sm/>
    </div>}

    {/* Ranking fornecedores com pendencia */}
    {fornRank.length>0&&<div className="bg-slate-800/40 border border-slate-700/50 rounded-xl p-4">
      <div className="text-sm font-semibold text-slate-300 mb-3 flex items-center gap-2"><Ic.Target s={14}/>{app.hasOcFinance?"Fornecedores com Maior Saldo Pendente":"Fornecedores"}</div>
      <div className="overflow-auto">
        <table className="w-full text-sm border-collapse">
          <thead><tr className="bg-slate-800/80">{(app.hasOcFinance?["Fornecedor","OCs","Valor Total","Pendente"]:["Fornecedor","OCs"]).map(function(h){return <th key={h} className="px-3 py-2 text-left text-xs font-semibold text-slate-400 uppercase tracking-wide">{h}</th>;})}</tr></thead>
          <tbody>{fornRank.map(function(f,i){return <tr key={i} className="border-t border-slate-800 hover:bg-slate-800/30">
            <td className="px-3 py-2 text-xs text-slate-300 max-w-xs truncate">{f.nome}</td>
            <td className="px-3 py-2 mono text-xs text-slate-400 text-right">{f.count}</td>
            {app.hasOcFinance&&<React.Fragment>
              <td className="px-3 py-2 mono text-xs text-slate-400 text-right">R$ {fmtNum(f.valor)}</td>
              <td className="px-3 py-2 mono text-xs font-semibold text-right"><span className={f.pendente>0?"text-amber-400":"text-slate-600"}>R$ {fmtNum(f.pendente)}</span></td>
            </React.Fragment>}
          </tr>;})}</tbody>
        </table>
      </div>
    </div>}

    {/* Filtros */}
    <div className="flex items-center gap-2 flex-wrap bg-slate-800/30 rounded-xl px-3 py-2 border border-slate-700/50">
      <span className="text-xs text-slate-500 font-medium">Filtros:</span>
      <select value={fPos} onChange={function(e){setFPos(e.target.value);}} className="bg-slate-800 border border-slate-700 rounded px-2 py-0.5 text-xs text-slate-300 h-7">
        <option value="all">Todas as Situacoes</option>
        <option value="2-Emitida">Emitida</option>
        <option value="3-Parcialmente entregue">Parc. Entregue</option>
        <option value="4-Entregue">Entregue</option>
      </select>
      <select value={fComp} onChange={function(e){setFComp(e.target.value);}} className="bg-slate-800 border border-slate-700 rounded px-2 py-0.5 text-xs text-slate-300 h-7">
        <option value="all">Todos Compradores</option>
        {compList.map(function(c){return <option key={c} value={c}>{c}</option>;})}
      </select>
      <select value={fOrig} onChange={function(e){setFOrig(e.target.value);}} className="bg-slate-800 border border-slate-700 rounded px-2 py-0.5 text-xs text-slate-300 h-7">
        <option value="all">Todas Origens</option>
        <option value="2-Requisicoes">Requisicoes</option>
        <option value="1-Manutencao de OC">Manutencao OC</option>
        <option value="5-Compra servicos externos">Servicos Externos</option>
      </select>
      {(fPos!=="all"||fComp!=="all"||fOrig!=="all")&&<button onClick={function(){setFPos("all");setFComp("all");setFOrig("all");}} className="px-2 py-0.5 bg-slate-700 hover:bg-slate-600 rounded text-xs text-slate-400 h-7">Limpar</button>}
      <span className="mono text-xs text-slate-500 ml-auto">{filtered.length} registros</span>
    </div>

    <DataTable cols={COL_OC_DET} data={filtered} fname="oc-fornecedores" ps={50}/>
  </div>;
}

/* BOTAO PDF nas tabelas */
function PdfBtn(props) {
  var ref2=props.ref2, title=props.title, onClick=props.onClick;
  var app=useApp();
  if(!ref2||!app.pdfIndex[ref2]) return <span className="text-slate-700 text-xs">--</span>;
  return <button onClick={function(e){e.stopPropagation();onClick(ref2,title);}}
    className="flex items-center gap-1 px-2 py-0.5 bg-violet-900/40 hover:bg-violet-800/60 border border-violet-500/30 rounded text-xs text-violet-300">
    <Ic.File s={11}/>PDF
  </button>;
}

/* MODAL VISUALIZADOR DE PDF */
function PdfModal(props) {
  var ref2=props.ref2, title=props.title, onClose=props.onClose;
  var app=useApp();
  var _u=useState(null), blobUrl=_u[0], setBlobUrl=_u[1];
  var file=app.pdfIndex[ref2];

  useEffect(function(){
    if(!file) return;
    var url=URL.createObjectURL(file);
    setBlobUrl(url);
    return function(){ URL.revokeObjectURL(url); setBlobUrl(null); };
  },[ref2]);

  useEffect(function(){
    function onKey(e){ if(e.key==="Escape") onClose(); }
    window.addEventListener("keydown",onKey);
    return function(){ window.removeEventListener("keydown",onKey); };
  },[]);

  return <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.88)",zIndex:2000,display:"flex",flexDirection:"column"}}>
    <div className="flex items-center justify-between px-5 py-3 bg-slate-900 border-b border-slate-700 flex-shrink-0">
      <div className="flex items-center gap-3 min-w-0">
        <Ic.File s={16} c="#a78bfa"/>
        <div className="flex flex-col min-w-0">
          <span className="font-semibold text-white text-sm truncate">{title||ref2}</span>
          <span className="mono text-slate-500 text-xs">{ref2}{file?" | "+file.name:""}</span>
        </div>
      </div>
      <div className="flex items-center gap-2 flex-shrink-0 ml-4">
        {blobUrl&&file&&<a href={blobUrl} download={file.name} className="flex items-center gap-1.5 px-3 py-1.5 bg-slate-700 hover:bg-slate-600 rounded-lg text-xs text-slate-300"><Ic.Dn s={12}/>Baixar</a>}
        <button onClick={onClose} className="flex items-center gap-1.5 px-3 py-1.5 bg-rose-900/40 hover:bg-rose-900/60 border border-rose-500/30 rounded-lg text-xs text-rose-400">
          <Ic.X s={12}/>Fechar (Esc)
        </button>
      </div>
    </div>
    <div className="flex-1 overflow-hidden p-3">
      {!file&&<div className="flex items-center justify-center h-full text-slate-500 text-sm">PDF nao encontrado para a referencia <span className="mono ml-1">{ref2}</span></div>}
      {blobUrl&&<iframe src={blobUrl} className="w-full h-full rounded-lg border border-slate-700" title={title||ref2}/>}
    </div>
  </div>;
}

/* PREVIEW DE PDF NO HOVER - miniatura da 1a pagina, sem controles */
function PdfHoverPreview(props) {
  var file=props.file, refCode=props.refCode, title=props.title;
  var _u=useState(null), blobUrl=_u[0], setBlobUrl=_u[1];
  useEffect(function(){
    if(!file) return;
    var url=URL.createObjectURL(file);
    setBlobUrl(url);
    return function(){ URL.revokeObjectURL(url); };
  },[file]);
  return <div style={{width:"280px"}}>
    <div className="bg-slate-800 px-2.5 py-1.5 border-b border-slate-700 flex items-center gap-1.5">
      <Ic.File s={11} c="#a78bfa"/>
      <span className="text-xs text-slate-200 font-medium truncate flex-1">{title||refCode}</span>
