function HoverCard(props) {
  var trigger=props.trigger, children=props.children;
  var _s=useState(false), show=_s[0], setShow=_s[1];
  var _r=useState(null), rect=_r[0], setRect=_r[1];
  var ref=useRef();
  var timer=useRef(null);
  function onEnter(){
    timer.current=setTimeout(function(){
      if(ref.current){setRect(ref.current.getBoundingClientRect());}
      setShow(true);
    },1000);
  }
  function onLeave(){
    clearTimeout(timer.current);
    setShow(false);
  }
  if(!children) return trigger||null;
  // Caixa fixa na viewport, sempre travada dentro das bordas (topo/base/esquerda/direita)
  var boxW=328, boxH=300, pad=8;
  var cardStyle=null;
  if(show&&rect){
    var vw=window.innerWidth, vh=window.innerHeight;
    var left=Math.min(Math.max(rect.left,pad),Math.max(pad,vw-boxW-pad));
    var spaceAbove=rect.top, spaceBelow=vh-rect.bottom;
    var top,transform;
    if(spaceAbove>=boxH||spaceAbove>=spaceBelow){
      top=Math.max(pad,rect.top-8);
      transform="translateY(-100%)";
    }else{
      top=Math.min(rect.bottom+6,Math.max(pad,vh-boxH-pad));
      transform="none";
    }
    cardStyle={position:"fixed",left:left+"px",top:top+"px",transform:transform,zIndex:9999,pointerEvents:"none"};
  }
  return <div ref={ref} style={{display:"inline-block"}} onMouseEnter={onEnter} onMouseLeave={onLeave}>
    {trigger}
    {show&&rect&&<div style={cardStyle}
      className="bg-slate-800 border border-slate-600 rounded-xl shadow-2xl p-3 w-80 max-h-72 overflow-y-auto">
      {children}
    </div>}
  </div>;
}

function TreeRow(props) {
  var row=props.row,depth=props.depth||0,rows=props.rows,exp=props.exp,toggle=props.toggle;
  var app=useApp();
  var children=rows.filter(function(r){return r.origemSequencia===row.seqOp;});
  var hasC=children.length>0;
  var isExp=exp[row.seqOp];
  var isCj=row.tipoReferencia==="conjunto";

  // Dados de OC e requisicao para o insumo desta linha
  var ocDados=null;
  var reqDados=[];
  if(row.refInsumo){
    var k=cleanCode(row.refInsumo);
    if(k&&app.ocByRef&&app.ocByRef[k]) ocDados=app.ocByRef[k][0];
    if(app.purRows){
      reqDados=app.purRows.filter(function(p){ return cleanCode(p.referenciaProduto)===k; }).slice(0,4);
    }
  }
  var hasInfo=ocDados||reqDados.length>0;

  // Centros de custo pendentes para este item (via pendingQueue)
  var pqItem=useMemo(function(){
    return app.pendingQueue.find(function(r){return r.seqOp===row.seqOp;});
  },[row.seqOp,app.pendingQueue]);
  var ccRaw=pqItem?(pqItem.centrosCustoPendentes||pqItem.centrosCusto||pqItem.ccAndamento||""):"";
  var ccList=String(ccRaw||"").split("/").map(function(s){return s.trim();}).filter(Boolean);

  /* Lista COMPLETA de centros de custo da posicao, com quais ja foram concluidos.
     Vem do Relatorio PCP (aba CC PEND VS CONCL, coluna "Encerrado?"). A exportacao
     antiga de Estrutura por OP nao traz os concluidos - nesse caso caimos de volta
     para a lista de pendentes e nenhum aparece riscado. */
  var ccTodos=useMemo(function(){
    var todos=String(row.centrosCustoTodos||"").split("/").map(function(s){return s.trim();}).filter(Boolean);
    var conc={};
    String(row.centrosCustoConcluidos||"").split("/").forEach(function(s){ var t=s.trim(); if(t) conc[t]=1; });
    if(!todos.length) todos=ccList;               /* formato antigo: so pendentes */
    return todos.map(function(cc){ return {nome:cc, concluido:!!conc[cc]}; });
  },[row.centrosCustoTodos,row.centrosCustoConcluidos,ccRaw]);
  var ccFeitos=ccTodos.filter(function(c){return c.concluido;}).length;

  // Stats do sub-CJ: barras de progresso (so para conjuntos com profundidade > 0)
  var subCjStats=useMemo(function(){
    if(!isCj||depth===0) return null;
    var desc=getDesc(row.seqOp,rows);
    if(!desc.length) return null;
    var allItems=[row].concat(desc);
    var encerrados=allItems.filter(function(r){var c=parseInt(posCode(r.posicao)||"0");return c>=4;}).length;
    var prodPct=Math.round(encerrados/allItems.length*100);
    var sups=app.intRows.filter(function(ir){
      return ir.tipoInsumo==="suprimento"&&desc.some(function(d){return d.seqOp===ir.seqOp&&d.refInsumo===ir.refInsumo;});
    });
    var comOc=sups.filter(function(r){return r.possuiOc;}).length;
    var cobPct=sups.length>0?Math.round(comOc/sups.length*100):null;
    return {prodPct:prodPct,cobPct:cobPct,total:allItems.length,encerrados:encerrados,totalSups:sups.length,comOc:comOc};
  },[row.seqOp,isCj,depth,rows,app.intRows]);

  // Celula de posicao: hover lista TODOS os centros de custo do item, com os
  // ja concluidos riscados. O contador "concluidos/total" fica visivel ao lado
  // do badge, para nao precisar passar o mouse so para saber o andamento.
  function PosCell(){
    var badge=<Badge type="pos" value={row.posicao}/>;
    if(!ccTodos.length) return badge;
    var pendentes=ccTodos.length-ccFeitos;
    var tudoFeito=pendentes===0;
    var trigger=<span className="cursor-help inline-flex items-center gap-1">
      {badge}
      <span className={"mono text-xs "+(tudoFeito?"text-emerald-400":"text-slate-500")}>{ccFeitos}/{ccTodos.length}</span>
    </span>;
    return <HoverCard trigger={trigger}>
      <div>
        <div className="bg-slate-800 px-3 py-2 border-b border-slate-700">
          <div className="text-xs font-bold text-white">{row.descricao||row.referencia}</div>
          <div className="text-xs mt-0.5 flex items-center gap-1">
            <Ic.Target s={10}/>
            <span className={tudoFeito?"text-emerald-400":"text-rose-400"}>
              {tudoFeito
                ? "Todos os "+ccTodos.length+" centros concluidos"
                : pendentes+" de "+ccTodos.length+" centro"+(ccTodos.length>1?"s":"")+" pendente"+(pendentes>1?"s":"")}
            </span>
          </div>
        </div>
        <div className="px-3 py-2 flex flex-col gap-1">
          {ccTodos.map(function(cc,i){return <div key={i} className="flex items-center gap-2">
            {cc.concluido
              ? <Ic.Ok s={11} c="#34d399"/>
              : <span className="w-1.5 h-1.5 rounded-full bg-rose-500 flex-shrink-0 mx-[3px]"/>}
            <span className={"text-xs "+(cc.concluido?"text-slate-500 line-through":"text-slate-300")}>{cc.nome}</span>
          </div>;})}
          {pqItem&&pqItem.bloqueioMaterial&&<div className="text-xs text-amber-400 mt-1 flex items-center gap-1"><Ic.Warn s={10}/>Bloqueio de material</div>}
        </div>
      </div>
    </HoverCard>;
  }

  // Mini barras para sub-CJs
  function MiniBar(p){
    var pct=p.pct, color=p.color||"bg-blue-500", label=p.label;
    return <div className="flex items-center gap-1.5" title={label?label+": "+pct+"%":undefined}>
      {label&&<span className="text-[10px] text-slate-600 uppercase tracking-wide flex-shrink-0">{label}</span>}
      <div className="w-14 h-1 bg-slate-700 rounded-full overflow-hidden flex-shrink-0">
        <div className={"h-full rounded-full "+color} style={{width:Math.min(100,pct)+"%"}}/>
      </div>
      <span className="mono text-xs text-slate-500 flex-shrink-0">{pct+"%"}</span>
    </div>;
  }

  function InsumoTooltip(){
    if(!hasInfo) return null;
    return <div className="flex flex-col gap-2">
      {ocDados&&<div>
        <div className="text-xs font-semibold text-blue-400 mb-1 flex items-center gap-1"><Ic.Cart s={10}/>OC Vinculada</div>
        <div className="grid grid-cols-2 gap-x-3 gap-y-0.5 text-xs">
          <span className="text-slate-500">Num. OC</span><span className="mono text-blue-300 font-semibold">{ocDados.numOcStr}</span>
          <span className="text-slate-500">Fornecedor</span><span className="text-slate-200 truncate">{ocDados.fornecedorNome}</span>
          <span className="text-slate-500">Prazo</span><span className={"mono "+(isPast(ocDados.menorEntrega)&&ocDados.posicao!=="4-Entregue"?"text-rose-400 font-semibold":"text-slate-300")}>{fmtDate(ocDados.menorEntrega)}</span>
          <span className="text-slate-500">Qtd OC</span><span className="mono text-slate-300">{fmtNum(ocDados.quantidade)}</span>
          <span className="text-slate-500">Situacao</span><span className={ocDados.posicao==="2-Emitido"||ocDados.posicao==="2-Emitida"?"text-blue-300":"text-emerald-300"}>{ocDados.posicao}</span>
          {ocDados.descricaoProduto&&<><span className="text-slate-500">Produto</span><span className="text-slate-400 truncate">{ocDados.descricaoProduto}</span></>}
        </div>
      </div>}
      {reqDados.length>0&&<div>
        <div className="text-xs font-semibold text-amber-400 mb-1 flex items-center gap-1"><Ic.Pkg s={10}/>Requisicoes</div>
        {reqDados.map(function(r,i){return <div key={i} className="grid grid-cols-2 gap-x-3 gap-y-0.5 text-xs border-t border-slate-700/50 pt-1 mt-1">
          <span className="text-slate-500">Requisicao</span><span className="mono text-slate-300">{r.requisicao}</span>
          <span className="text-slate-500">Situacao</span><span className={sitCode(r.situacao)==="7"||sitCode(r.situacao)==="8"?"text-emerald-300":sitCode(r.situacao)==="2"?"text-blue-300":"text-amber-300"}>{r.situacao}</span>
          <span className="text-slate-500">Data Nec.</span><span className={"mono "+(isPast(r.dataNecessidade)&&sitCode(r.situacao)!=="7"&&sitCode(r.situacao)!=="8"?"text-rose-400 font-semibold":"text-slate-300")}>{fmtDate(r.dataNecessidade)}</span>
          <span className="text-slate-500">Qtd</span><span className="mono text-slate-300">{fmtNum(r.quantidade)}</span>
        </div>;})}
      </div>}
    </div>;
  }

  var insumoCell=row.refInsumo&&hasInfo
    ?<HoverCard trigger={<span className={"mono text-xs cursor-help "+(ocDados?"text-blue-400 underline decoration-dotted":reqDados.length?"text-amber-400 underline decoration-dotted":"text-slate-500")}>{row.refInsumo}</span>}><InsumoTooltip/></HoverCard>
    :<span className="text-xs mono text-slate-500">{row.refInsumo||"--"}</span>;

  var descCell=row.descInsumo&&hasInfo
    ?<HoverCard trigger={<span className="text-xs text-slate-400 max-w-xs truncate cursor-help underline decoration-dotted">{row.descInsumo}</span>}><InsumoTooltip/></HoverCard>
    :<span className="text-xs text-slate-500 max-w-xs truncate">{row.descInsumo||"--"}</span>;

  return <React.Fragment>
    <tr className="border-t border-slate-800 hover:bg-slate-800/30">
      <td className="px-3 py-1.5 text-xs mono text-slate-500">{row.seqOp!=null?row.seqOp:""}</td>
      <td className="py-1.5" style={{paddingLeft:(10+depth*18)+"px"}}>
        <div className="flex items-center gap-1">
          {hasC?<button onClick={function(){toggle(row.seqOp);}}>
            {isExp?<Ic.CDn s={12} c="#64748b"/>:<Ic.CRt s={12} c="#64748b"/>}
          </button>:<span className="w-4"/>}
          {app.pdfIndex[row.referencia]
            ?<HoverCard trigger={<span className="text-xs mono text-violet-300 underline decoration-dotted cursor-pointer"
                onClick={function(e){e.stopPropagation();app.openPdf(row.referencia,row.descricao);}}>{row.referencia}</span>}>
                <PdfHoverPreview file={app.pdfIndex[row.referencia]} refCode={row.referencia} title={row.descricao}/>
              </HoverCard>
            :<span className="text-xs mono text-slate-300">{row.referencia}</span>}
        </div>
      </td>
      <td className="px-3 py-1.5 text-xs text-slate-400 max-w-xs truncate">{row.descricao}</td>
      <td className="px-3 py-1.5">
        <div className="flex flex-col gap-1">
          <Badge type="ref" value={row.tipoReferencia}/>
          {subCjStats&&<div className="flex flex-col gap-0.5 mt-0.5">
            <MiniBar pct={subCjStats.prodPct} label="Producao" color={subCjStats.prodPct>=90?"bg-emerald-500":subCjStats.prodPct>=50?"bg-cyan-500":subCjStats.prodPct>0?"bg-blue-500":"bg-slate-600"}/>
          </div>}
        </div>
      </td>
      <td className="px-3 py-1.5"><PosCell/></td>
      <td className="px-3 py-1.5">{insumoCell}</td>
      <td className="px-3 py-1.5">{descCell}</td>
    </tr>
    {isExp&&children.map(function(c){return <TreeRow key={c.seqOp+"-"+c.refInsumo} row={c} depth={depth+1} rows={rows} exp={exp} toggle={toggle}/>;})}</React.Fragment>;
}

function DashStructure() {
  var app=useApp();
  // view: "cjs" = lista de conjuntos nivel 0 | "tree" = arvore de um CJ selecionado | "all" = tabela completa
  var _view=useState("cjs"), view=_view[0], setView=_view[1];
  var _sel=useState(null), selCj=_sel[0], setSelCj=_sel[1];
  var _exp=useState({}), exp=_exp[0], setExp=_exp[1];

  // Conjuntos de nivel 0: filhos diretos da raiz (origemSequencia===null, nao eh o projeto)
  var topCjs=useMemo(function(){
    return app.strRows.filter(function(r){
      return r.origemSequencia===null && r.tipoReferencia==="conjunto";
    });
  },[app.strRows]);

  // Enriquecer cada CJ com stats da sua arvore
  var cjStats=useMemo(function(){
    var stats={};
    topCjs.forEach(function(cj){
      var desc=getDesc(cj.seqOp,app.strRows);
      var descSeqs=desc.map(function(r){return r.seqOp;});
      var pecas=desc.filter(function(r){return r.tipoReferencia==="peca_fabricada";}).length;
      var sups=desc.filter(function(r){return r.tipoInsumo==="suprimento";}).length;
      var subCjs=desc.filter(function(r){return r.tipoReferencia==="conjunto";}).length;
      // Progresso de producao: itens encerrados (posCode=5) / total
      var encerrados=desc.filter(function(r){return posCode(r.posicao)==="5";}).length;
      var totalItems=desc.length+1; // +1 para o proprio CJ
      var encPct=totalItems>0?Math.round(encerrados/totalItems*100):0;
      // Cobertura OC
      var supInt=app.intRows.filter(function(r){return r.tipoInsumo==="suprimento"&&desc.some(function(d){return d.seqOp===r.seqOp&&d.refInsumo===r.refInsumo;});});
      var comOc=supInt.filter(function(r){return r.possuiOc;}).length;
      var cobPct=sups>0?Math.round(comOc/sups*100):0;
      // Centros pendentes desta arvore
      var ccPend={};
      app.pendingQueue.filter(function(r){return descSeqs.indexOf(r.seqOp)>=0;}).forEach(function(r){
        if(r.ccAndamento) ccPend[r.ccAndamento]=(ccPend[r.ccAndamento]||0)+1;
      });
      stats[cj.seqOp]={total:desc.length,pecas:pecas,sups:sups,subCjs:subCjs,cobPct:cobPct,comOc:comOc,encerrados:encerrados,encPct:encPct,ccPend:ccPend};
    });
    return stats;
  },[topCjs,app.strRows,app.intRows,app.pendingQueue]);

  // Colunas para a lista de CJs nivel 0
  var COL_CJS=[
    {key:"seqOp",label:"Seq",cls:"mono text-xs w-12",get:function(r){return String(r.seqOp||"");}},
    {key:"referencia",label:"Referencia",cls:"mono text-xs"},
    {key:"descricao",label:"Conjunto",cls:"text-sm font-semibold text-slate-200"},
    {key:"posicao",label:"Posicao",ns:true,render:function(r){return <Badge type="pos" value={r.posicao}/>;},get:function(r){return r.posicao;}},
    {key:"_total",label:"Itens",cls:"mono text-xs text-right",ns:true,render:function(r){var s=cjStats[r.seqOp];return <span className="mono text-xs text-slate-400">{s?s.total:"--"}</span>;},get:function(r){var s=cjStats[r.seqOp];return s?String(s.total):"";}},
    {key:"_pecas",label:"Pecas",cls:"mono text-xs text-right",ns:true,render:function(r){var s=cjStats[r.seqOp];return <span className="mono text-xs text-cyan-400">{s?s.pecas:"--"}</span>;},get:function(r){var s=cjStats[r.seqOp];return s?String(s.pecas):"";}},
    {key:"_sups",label:"Suprim.",cls:"mono text-xs text-right",ns:true,render:function(r){var s=cjStats[r.seqOp];return <span className="mono text-xs text-amber-400">{s?s.sups:"--"}</span>;},get:function(r){var s=cjStats[r.seqOp];return s?String(s.sups):"";}},
    {key:"_cob",label:"Cobertura OC",ns:true,render:function(r){
      var s=cjStats[r.seqOp]; if(!s||s.sups===0) return <span className="text-slate-600 text-xs">--</span>;
      var col=s.cobPct>=90?"text-emerald-400":s.cobPct>=70?"text-yellow-400":s.cobPct>=40?"text-orange-400":"text-rose-400";
      var bg=s.cobPct>=90?"bg-emerald-500":s.cobPct>=70?"bg-yellow-500":s.cobPct>=40?"bg-orange-500":"bg-rose-500";
      var bar=<div className="flex items-center gap-2 min-w-28 cursor-help">
        <div className="flex-1 h-2 bg-slate-700 rounded-full overflow-hidden"><div className={"h-full "+bg+" rounded-full transition-all"} style={{width:Math.min(100,s.cobPct)+"%"}}/></div>
        <span className={"mono text-xs font-semibold "+col}>{s.cobPct+"%"}</span>
      </div>;
      var ccKeys=s.ccPend?Object.keys(s.ccPend):[];
      if(!ccKeys.length) return bar;
      return <HoverCard trigger={bar}><div>
        <div className="text-xs font-semibold text-rose-400 mb-2 flex items-center gap-1"><Ic.Target s={10}/>Centros Pendentes ({ccKeys.length})</div>
        {ccKeys.sort(function(a,b){return s.ccPend[b]-s.ccPend[a];}).map(function(cc){return <div key={cc} className="flex justify-between items-center py-0.5"><span className="text-xs text-slate-300">{cc}</span><span className="mono text-xs text-rose-400">{s.ccPend[cc]} item{s.ccPend[cc]>1?"s":""}</span></div>;})}
      </div></HoverCard>;
    },get:function(r){var s=cjStats[r.seqOp];return s?String(s.cobPct):"";}},
    {key:"_prod",label:"Prog. Producao",ns:true,render:function(r){
      var s=cjStats[r.seqOp];
      if(!s||s.total===0) return <span className="text-slate-600 text-xs">--</span>;
      var pct=s.encPct;
      var col=pct>=90?"text-emerald-400":pct>=50?"text-cyan-400":pct>0?"text-blue-400":"text-slate-500";
      var bg=pct>=90?"bg-emerald-500":pct>=50?"bg-cyan-500":pct>0?"bg-blue-500":"bg-slate-600";
      var ccKeys=s.ccPend?Object.keys(s.ccPend):[];
      var bar=<div className="flex items-center gap-2 min-w-28 cursor-help">
        <div className="flex-1 h-2 bg-slate-700 rounded-full overflow-hidden"><div className={"h-full "+bg+" rounded-full transition-all"} style={{width:Math.min(100,pct)+"%"}}/></div>
        <span className={"mono text-xs font-semibold "+col}>{pct+"%"}</span>
      </div>;
      if(!ccKeys.length) return bar;
      return <HoverCard trigger={bar}><div>
        <div className="text-xs font-semibold text-cyan-400 mb-1">{s.encerrados} de {s.total} itens encerrados</div>
        {ccKeys.length>0&&<><div className="text-xs font-semibold text-rose-400 mt-2 mb-1 flex items-center gap-1"><Ic.Target s={10}/>Centros Ainda Pendentes</div>
        {ccKeys.sort(function(a,b){return s.ccPend[b]-s.ccPend[a];}).map(function(cc){return <div key={cc} className="flex justify-between items-center py-0.5"><span className="text-xs text-slate-300">{cc}</span><span className="mono text-xs text-rose-400">{s.ccPend[cc]}</span></div>;})}</>}
      </div></HoverCard>;
    },get:function(r){var s=cjStats[r.seqOp];return s?String(s.encPct):"";}},
    {key:"_open",label:"",ns:true,cls:"w-16",render:function(r){
      return <button onClick={function(e){e.stopPropagation();setSelCj(r);setView("tree");setExp({});}}
        className="flex items-center gap-1 px-2.5 py-1 bg-blue-700/40 hover:bg-blue-700/70 border border-blue-500/40 rounded text-xs text-blue-300">
        <Ic.CRt s={11}/>Ver
      </button>;
    }}
  ].concat(Object.keys(app.pdfIndex).length>0?[{key:"_pdf",label:"PDF",ns:true,render:function(r){return <PdfBtn ref2={r.referencia} title={r.descricao} onClick={app.openPdf}/>;},get:function(r){return app.pdfIndex[r.referencia]?"sim":"nao";}}]:[]);

  // Subtree do CJ selecionado
  var cjSubRows=useMemo(function(){
    if(!selCj) return [];
    return getDesc(selCj.seqOp,app.strRows);
  },[selCj,app.strRows]);

  function toggle(seq){setExp(function(e){var n=Object.assign({},e);n[seq]?delete n[seq]:n[seq]=1;return n;});}
  function expandAll(){var n={};if(selCj&&selCj.seqOp!=null)n[selCj.seqOp]=1;cjSubRows.forEach(function(r){if(r.seqOp!=null)n[r.seqOp]=1;});setExp(n);}
  function colAll(){setExp({});}

  if(!app.strRows.length) return <Empty Icon={Ic.List} title="Estrutura nao carregada" desc="Carregue o arquivo XLSX ou CSV de estrutura da OP"/>;

  // VIEW: lista CJs nivel 0
  if(view==="cjs") return <div className="p-6 flex flex-col gap-3">
    <div className="flex items-center gap-3 flex-wrap">
      <h2 className="text-lg font-bold text-white flex items-center gap-2"><Ic.Boxes s={17}/>Conjuntos Nivel 0</h2>
      <span className="text-xs text-slate-500 bg-slate-800 px-2 py-0.5 rounded mono">{topCjs.length} conjuntos</span>
      <span className="text-xs text-slate-600">|</span>
      <span className="text-xs text-slate-500">{app.strRows.length} itens totais</span>
      <button onClick={function(){setView("all");}} className="ml-auto flex items-center gap-1 px-2.5 py-1 bg-slate-700 hover:bg-slate-600 border border-slate-600 rounded text-xs text-slate-400">
        <Ic.List s={11}/>Ver todos os {app.strRows.length} itens
      </button>
    </div>
    <DataTable cols={COL_CJS} data={topCjs} fname="conjuntos-nivel0" ps={50}/>
    {app.pdfModal&&<PdfModal ref2={app.pdfModal.ref} title={app.pdfModal.title} onClose={app.closePdf}/>}
  </div>;

  // VIEW: arvore do CJ selecionado
  if(view==="tree"&&selCj) {
    var pdfCols=Object.keys(app.pdfIndex).length>0?[{key:"_pdf",label:"PDF",ns:true,render:function(r){return <PdfBtn ref2={r.referencia} title={r.descricao} onClick={app.openPdf}/>;},get:function(r){return app.pdfIndex[r.referencia]?"sim":"nao";}}]:[];
    var s=cjStats[selCj.seqOp]||{};
    return <div className="p-6 flex flex-col gap-3">
      <div className="flex items-center gap-3 flex-wrap">
        <button onClick={function(){setView("cjs");setSelCj(null);}} className="flex items-center gap-1 px-3 py-1.5 bg-slate-700 hover:bg-slate-600 rounded-lg text-xs text-slate-300">
          <Ic.CUp s={11}/>Voltar
        </button>
        <div className="flex items-center gap-2">
          <Badge type="ref" value="conjunto"/>
          <h2 className="text-base font-bold text-white">{selCj.descricao}</h2>
          <span className="mono text-xs text-slate-500">{selCj.referencia}</span>
        </div>
        <div className="flex items-center gap-3 ml-2 text-xs text-slate-500">
          <span className="text-cyan-400 font-semibold">{s.pecas||0} pecas</span>

function DashIntegrated() {
  var app=useApp();
  var _sub=useState("comOc"), sub=_sub[0], setSub=_sub[1];

  // Usar intRowsOc (enriquecido com dados de OC) se disponivel
  var baseRows=app.ocRows.length>0?app.intRowsOc:app.intRows;
  var supRows=useMemo(function(){return baseRows.filter(function(r){return r.tipoInsumo==="suprimento";});}, [baseRows]);
  var comOc=useMemo(function(){return supRows.filter(function(r){return r.possuiOc;});}, [supRows]);
  var semOc=useMemo(function(){return supRows.filter(function(r){return !r.possuiOc;});}, [supRows]);
  var comOcDetalhe=useMemo(function(){return comOc.filter(function(r){return !!r.ocDetalhe;});}, [comOc]);

  // Colunas extras de OC (mostradas apenas quando arquivo OC esta carregado)
  var colsOcExtra=app.ocRows.length>0?[
    {key:"_numOc",label:"Num. OC",ns:true,
      render:function(r){return r.ocDetalhe?<span className="mono text-xs text-blue-300 font-semibold">{r.ocDetalhe.numOcStr}</span>:<span className="text-slate-600 text-xs">--</span>;},
      get:function(r){return r.ocDetalhe?r.ocDetalhe.numOcStr:"";}},
    {key:"_qtdOc",label:"Qtd OC",ns:true,
      render:function(r){
        if(!r.ocDetalhe) return <span className="text-slate-600 text-xs">--</span>;
        var qtdOc=r.ocDetalhe.quantidade;
        var qtdReq=r.quantidadeOcTotal;
        var diverge=qtdOc>0&&qtdReq>0&&Math.abs(qtdOc-qtdReq)>0.001;
        return <div className="flex items-center gap-1">
          <span className={"mono text-xs font-semibold "+(diverge?"text-amber-400":"text-slate-300")}>{fmtNum(qtdOc)}</span>
          {diverge&&<span className="text-xs text-amber-600" title={"Requisitado: "+fmtNum(qtdReq)}>!</span>}
        </div>;
      },
      get:function(r){return r.ocDetalhe?fmtNum(r.ocDetalhe.quantidade):"";}},
    {key:"_descOc",label:"Produto OC",ns:true,
      render:function(r){return r.ocDetalhe&&r.ocDetalhe.descricaoProduto?<span className="text-xs text-slate-400 max-w-xs truncate block">{r.ocDetalhe.descricaoProduto}</span>:<span className="text-slate-600 text-xs">--</span>;},
      get:function(r){return r.ocDetalhe?r.ocDetalhe.descricaoProduto:""}},
    {key:"_forn",label:"Fornecedor OC",ns:true,
      render:function(r){return r.ocDetalhe?<span className="text-xs text-slate-300 max-w-xs truncate block">{r.ocDetalhe.fornecedorNome}</span>:<span className="text-slate-600 text-xs">--</span>;},
      get:function(r){return r.ocDetalhe?r.ocDetalhe.fornecedorNome:"";}},
    {key:"_entrega",label:"Prazo Entrega",ns:true,
      render:function(r){
        if(!r.ocDetalhe) return <span className="text-slate-600 text-xs">--</span>;
        var past=isPast(r.ocDetalhe.menorEntrega)&&r.ocDetalhe.posicao!=="4-Entregue";
        return <span className={"mono text-xs "+(past?"text-rose-400 font-semibold":"text-slate-300")}>{fmtDate(r.ocDetalhe.menorEntrega)}</span>;
      },
      get:function(r){return r.ocDetalhe?fmtDate(r.ocDetalhe.menorEntrega):"";}},
    {key:"_posOc",label:"Sit. OC",ns:true,
      render:function(r){
        if(!r.ocDetalhe) return <span className="text-slate-600 text-xs">--</span>;
        var pos=r.ocDetalhe.posicao;
        var col=(pos==="2-Emitida"||pos==="2-Emitido")?"bg-blue-500/20 text-blue-300 border-blue-500/30":pos==="4-Entregue"?"bg-emerald-500/20 text-emerald-300 border-emerald-500/30":"bg-orange-500/20 text-orange-300 border-orange-500/30";
        return <span className={"px-1.5 py-0.5 rounded text-xs border "+col}>{pos.split("-")[1]||pos}</span>;

      get:function(r){return r.ocDetalhe?r.ocDetalhe.posicao:"";}},
  ]:[];

  var pdfCols=Object.keys(app.pdfIndex).length>0?[{key:"_pdf",label:"PDF",ns:true,render:function(r){return <PdfBtn ref2={r.referencia} title={r.descricao} onClick={app.openPdf}/>;},get:function(r){return app.pdfIndex[r.referencia]?"sim":"nao";}}]:[];

  var colsComOc=COL_INT_COM.concat(colsOcExtra).concat(pdfCols);
  var colsSemOc=COL_SUP.concat(colsOcExtra).concat(pdfCols);

  if(!app.intRows.length) return <Empty Icon={Ic.Merge} title="Sem dados integrados" desc="Carregue ambos os arquivos"/>;
  return <div className="p-6 flex flex-col gap-4">
    <div className="flex items-center gap-3 flex-wrap">
      <h2 className="text-lg font-bold text-white flex items-center gap-2"><Ic.Merge s={17}/>Visao Integrada</h2>
      <span className="text-xs text-slate-500 bg-slate-800 px-2 py-0.5 rounded mono">{supRows.length} suprimentos</span>
      {app.ocRows.length>0&&<span className={"flex items-center gap-1 px-2 py-0.5 rounded text-xs border "+(app.hasOcRef?"bg-emerald-900/30 border-emerald-500/30 text-emerald-400":"bg-blue-900/30 border-blue-500/30 text-blue-400")}>
        <Ic.Cart s={11}/>{app.hasOcRef?(comOcDetalhe.length+" vinculados via referencia"):("OC carregada: "+app.ocRows.length+" registros - sem ref. produto")}
      </span>}
      {app.ocRows.length>0&&!app.hasOcRef&&<span className="text-xs text-slate-500 italic">Exporte itens de OC do SIGER (com Referencia produto) para vincular fornecedor por produto</span>}
    </div>
    <Tabs items={[["comOc","Com OC ("+comOc.length+")"+(app.hasOcRef&&comOcDetalhe.length>0?" | "+comOcDetalhe.length+" c/ fornecedor":"")],["semOc","Sem OC ("+semOc.length+")"]]} active={sub} onSelect={setSub}/>
    {sub==="comOc"&&<DataTable cols={colsComOc} data={comOc} fname="integrado-com-oc" ps={50}/>}
    {sub==="semOc"&&<DataTable cols={colsSemOc} data={semOc} fname="integrado-sem-oc" ps={50}/>}
    {app.kpis&&<div className="grid grid-cols-2 md:grid-cols-4 gap-3 mt-2 pt-3 border-t border-slate-800">
      <KPI icon={Ic.Target} label="Cobertura OC" value={Math.round(app.kpis.percentualCoberturaOc)+"%"} g={app.kpis.percentualCoberturaOc>=90?"emerald":app.kpis.percentualCoberturaOc>=70?"amber":"rose"} sm/>
      <KPI icon={Ic.Lnk} label="Com OC" value={fmtNum(app.kpis.itensComOc)} g="emerald" sm/>
      <KPI icon={Ic.Unlnk} label="Sem OC" value={fmtNum(app.kpis.itensSemOc)} g="rose" sm/>
      {app.ocRows.length>0&&app.hasOcRef
        ?<KPI icon={Ic.Cart} label="Com Dados Fornecedor" value={comOcDetalhe.length} sub={"de "+comOc.length+" com OC"} g="blue" sm/>
        :<KPI icon={Ic.Pkg} label="Total Suprim." value={fmtNum(app.kpis.totalItensSuprimento)} g="blue" sm/>
      }
    </div>}
    {app.pdfModal&&<PdfModal ref2={app.pdfModal.ref} title={app.pdfModal.title} onClose={app.closePdf}/>}
  </div>;
}

/* TOOLTIP GLOBAL */
function TooltipPortal() {
  var app=useApp();
  var tt=app.tooltip;
  if(!tt) return null;
  var style={
    position:"fixed",
    left:Math.min(tt.x+14, window.innerWidth-340),
    top:tt.y+16,
    zIndex:9999,
    maxWidth:"340px",
    minWidth:"200px",
    pointerEvents:"none"
  };
  return <div style={style} className="bg-slate-900 border border-slate-600 rounded-xl shadow-2xl text-xs overflow-hidden">
    {tt.content}
  </div>;
}

function SupTooltip(props) {
  var refInsumo=props.refInsumo, seqOp=props.seqOp;
  var app=useApp();
  var row=useMemo(function(){
    return app.intRowsOc.find(function(r){
      return r.refInsumo===refInsumo&&(seqOp==null||r.seqOp===seqOp);
    })||app.intRowsOc.find(function(r){return r.refInsumo===refInsumo;});
  },[refInsumo,seqOp,app.intRowsOc]);
  if(!row) return <div className="p-3 text-slate-500">Sem dados de OC/Requisicao para <span className="mono text-slate-400">{refInsumo}</span></div>;
  var purs=row.ocsVinculadas||[];
  var oc=row.ocDetalhe;
  var past=oc&&isPast(oc.menorEntrega)&&oc.posicao!=="4-Entregue";
  return <div>
    <div className="bg-slate-800 px-3 py-2 border-b border-slate-700">
      <div className="font-bold text-slate-200">{row.descInsumo||refInsumo}</div>
      <div className="mono text-slate-400 text-xs">{refInsumo}</div>
    </div>
    {purs.length>0&&<div className="px-3 py-2 border-b border-slate-700/50">
      <div className="text-xs font-semibold text-slate-500 uppercase mb-2">Requisicoes ({purs.length})</div>
      {purs.slice(0,4).map(function(pur,i){return <div key={i} className="flex flex-col gap-0.5 mb-2 bg-slate-800/50 rounded p-1.5">
        <div className="flex items-center gap-2 justify-between">
          <span className="mono text-slate-300">Req #{pur.requisicao}</span>
          <span className={"px-1.5 py-0.5 rounded text-xs "+getBadgeClass(pur.situacao)}>{pur.situacao}</span>
        </div>
        <div className="flex gap-3 text-slate-400">
          <span>Qtd: <span className="mono text-slate-300">{fmtNum(pur.quantidade)}</span></span>
          <span>Saldo: <span className={"mono "+(pur.qtdSaldo>0?"text-amber-300":"text-emerald-400")}>{fmtNum(pur.qtdSaldo)}</span></span>
        </div>
        {pur.dataNecessidade&&<div className={"mono text-xs "+(isPast(pur.dataNecessidade)&&pur.qtdSaldo>0?"text-rose-400":"text-slate-500")}>Necessidade: {fmtDate(pur.dataNecessidade)}</div>}
        {pur.requisitante&&<div className="text-slate-500">{pur.requisitante} - {pur.centroCusto}</div>}
      </div>;})}
      {purs.length>4&&<div className="text-slate-600 text-xs">+{purs.length-4} mais...</div>}
    </div>}
    {oc&&<div className="px-3 py-2">
      <div className="text-xs font-semibold text-slate-500 uppercase mb-2">Ordem de Compra</div>
      <div className="bg-blue-900/30 border border-blue-700/30 rounded-lg p-2 flex flex-col gap-1">
        <div className="flex items-center justify-between">
          <span className="mono text-blue-300 font-bold">OC #{oc.numOcStr}</span>
          <span className={"px-1.5 py-0.5 rounded text-xs border "+((oc.posicao==="2-Emitida"||oc.posicao==="2-Emitido")?"bg-blue-500/20 text-blue-300 border-blue-500/30":oc.posicao==="4-Entregue"?"bg-emerald-500/20 text-emerald-300 border-emerald-500/30":"bg-orange-500/20 text-orange-300 border-orange-500/30")}>{oc.posicao}</span>
        </div>
        <div className="text-slate-300 font-medium">{oc.fornecedorNome}</div>
        <div className="flex gap-3 text-slate-400">
          <span>Qtd: <span className="mono text-slate-300">{fmtNum(oc.quantidade)}</span></span>
          {oc.dtNovaEntrega?<span className="text-amber-400">Nova entrega: <span className="mono">{fmtDate(oc.dtNovaEntrega)}</span></span>:<span className={"mono "+(past?"text-rose-400 font-semibold":"text-slate-300")}>Prazo: {fmtDate(oc.menorEntrega)}</span>}
        </div>
        {past&&<div className="text-rose-400 font-semibold text-xs">PRAZO VENCIDO</div>}
      </div>
    </div>}
    {!oc&&purs.length===0&&<div className="px-3 py-2 text-slate-500">Sem OC ou requisicao vinculada</div>}
  </div>;
}

function getBadgeClass(situacao){
  var c=sitCode(situacao);
  if(c==="2") return "bg-blue-500/20 text-blue-300";
  if(c==="7"||c==="8") return "bg-emerald-500/20 text-emerald-300";
  if(c==="6") return "bg-amber-500/20 text-amber-300";
  if(c==="11") return "bg-rose-500/20 text-rose-300";
  return "bg-slate-500/20 text-slate-300";
}

function CjCentrosTooltip(props) {
  var seqOp=props.seqOp, cjName=props.cjName;
  var app=useApp();
  var centros=useMemo(function(){
    if(!app.pendingQueue.length) return [];
    // Pegar todos os itens da arvore deste CJ que tem centros pendentes
    var desc=getDesc(seqOp,app.strRows);
    var descSeqs=new Set(desc.map(function(r){return r.seqOp;}));
    descSeqs.add(seqOp);
    var queueItems=app.pendingQueue.filter(function(r){return descSeqs.has(r.seqOp);});
    var ccMap={};
    queueItems.forEach(function(r){
      (r.centrosCustoStr||r.centrosCusto||"").split("/").map(function(s){return s.trim();}).filter(Boolean).forEach(function(cc){
        if(!ccMap[cc]) ccMap[cc]={cc:cc,count:0,bloqueio:0};
        ccMap[cc].count++;
        if(r.bloqueioMaterial) ccMap[cc].bloqueio++;
      });
    });
    return Object.values(ccMap).sort(function(a,b){return b.count-a.count;});
  },[seqOp,app.pendingQueue,app.strRows]);

  return <div>
    <div className="bg-slate-800 px-3 py-2 border-b border-slate-700">
      <div className="font-bold text-slate-200">{cjName}</div>
      <div className="text-slate-400 text-xs">Centros de custo pendentes</div>
    </div>
    {centros.length===0?<div className="px-3 py-3 text-emerald-400 text-xs">Nenhum centro pendente!</div>:
    <div className="px-3 py-2 flex flex-col gap-1 max-h-60 overflow-y-auto">
      {centros.map(function(c){return <div key={c.cc} className="flex items-center justify-between gap-3">
        <span className="text-slate-300">{c.cc}</span>
        <div className="flex items-center gap-2">
          {c.bloqueio>0&&<span className="text-rose-400 text-xs">Bloq. mat.</span>}
          <span className="mono text-slate-400">{c.count} item{c.count>1?"s":""}</span>
        </div>
      </div>;})}
    </div>}
  </div>;
}

/* ERROR BOUNDARY - isola falha de um painel, o resto do sistema continua funcionando */
var ErrorBoundary = (function(){
  function EB(props){ _React.Component.call(this,props); this.state={err:null}; }
  EB.prototype = Object.create(_React.Component.prototype);
  EB.prototype.constructor = EB;
  EB.getDerivedStateFromError = function(err){ return {err:err}; };
  EB.prototype.componentDidCatch = function(err,info){ try{ console.error("[PainelPCP] Falha em",this.props.tag||"painel",err,info); }catch(e){} };
  EB.prototype.componentDidUpdate = function(prev){
    if(prev.resetKey !== this.props.resetKey && this.state.err){ this.setState({err:null}); }
  };
  EB.prototype.render = function(){
    var self=this;
    if(this.state.err){
      return <div className="p-6">
        <div className="bg-rose-900/20 border border-rose-500/40 rounded-2xl p-5 max-w-2xl">
          <div className="flex items-center gap-2 mb-2">
            <Ic.Warn s={16} c="#fb7185"/>
            <h3 className="font-bold text-rose-300">Falha ao montar este painel</h3>
          </div>
          <p className="text-sm text-slate-400 mb-3">Os dados carregados continuam intactos. Troque de aba para seguir trabalhando, ou tente montar novamente.</p>
          <pre className="text-xs text-rose-300/80 bg-slate-950 rounded-lg p-3 overflow-auto max-h-32 mb-3 whitespace-pre-wrap">{String(this.state.err&&this.state.err.message||this.state.err)}</pre>
          <button onClick={function(){self.setState({err:null});}} className="flex items-center gap-1.5 px-3 py-1.5 bg-slate-700 hover:bg-slate-600 rounded-lg text-xs text-slate-200">
            <Ic.Ref s={12}/>Tentar novamente
          </button>
        </div>
      </div>;
    }
    return this.props.children;
  };
  return EB;
})();

function Layout() {
  var app=useApp();
  var _col=useState(false), col=_col[0], setCol=_col[1];
  var Dash=DASH_MAP[app.tab]||DashOverview;
  return <div className="flex h-screen overflow-hidden">
    <Sidebar col={col} setCol={setCol}/>
    <div className="flex-1 flex flex-col overflow-hidden">
      <Header/>
      {app.err&&<div className="mx-5 mt-3 flex items-start gap-2 px-4 py-2.5 bg-rose-900/25 border border-rose-500/40 rounded-xl">
        <span className="mt-0.5 flex-shrink-0"><Ic.Warn s={14} c="#fb7185"/></span>
        <span className="text-xs text-rose-200 flex-1">{app.err}</span>
        <button onClick={function(){app.clearErr();}} className="flex-shrink-0 text-rose-400 hover:text-rose-200"><Ic.X s={13}/></button>
      </div>}
      <main className="flex-1 overflow-y-auto"><ErrorBoundary tag={app.tab} resetKey={app.tab}><Dash/></ErrorBoundary></main>
    </div>
    <TooltipPortal/>
  </div>;
}

function App() { return <AppProvider><Layout/></AppProvider>; }

window.__appLoaded = true;
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);

<style id="td-theme-light">
/* O app inteiro foi construido com cores fixas (bg-slate-800, text-slate-400 etc),
   sem variaveis de tema. Em vez de sobrescrever cada uma das 150+ classes usadas,
   inverte-se a paleta inteira (dark vira light automaticamente e mantendo o
   mesmo contraste/hierarquia visual) e desfaz-se a inversao só nos elementos que
   precisam continuar com cor real (o PDF renderizado dentro do iframe). */
body.light{ color-scheme:light; background:#f2f0ec; }
body.light #root{ filter:invert(1) hue-rotate(180deg); }
body.light #root iframe{ filter:invert(1) hue-rotate(180deg); }
body.light::-webkit-scrollbar-track,
body.light ::-webkit-scrollbar-track,
body.light ::-webkit-scrollbar-corner{background:#e7e3db}
body.light ::-webkit-scrollbar-thumb{background:#E8000D;border:2px solid #e7e3db}
</style>

<style id="td-theme-transition">
  html{transition:filter .18s ease}
  body, body *{transition:background-color .45s ease, border-color .45s ease, color .45s ease, box-shadow .45s ease !important}
</style>
<script id="td-theme-sync">
(function(){
  function curva(v){
    v = Math.max(0, Math.min(100, Number(v)));
    if(v < 50) return { paleta:'dark',  filtro: 0.72 + (v/50)*0.28 };
    return          { paleta:'light', filtro: 1.00 + ((v-50)/50)*0.12 };
  }
  function aplica(v){
    var c = curva(v);
    var claro = (c.paleta === 'light');
    try{
      if(typeof applyTheme === 'function'){ applyTheme(claro ? 'light' : 'dark'); }
      else { document.body.classList.toggle('light', claro); document.body.classList.toggle('dark', !claro); }
    }catch(e){
      document.body.classList.toggle('light', claro);
      document.body.classList.toggle('dark', !claro);
    }
    document.documentElement.style.filter = 'brightness(' + c.filtro.toFixed(3) + ')';
  }
  window.addEventListener('message', function(e){
    if(e.data && typeof e.data.tdBright === 'number') aplica(e.data.tdBright);
  });
  function inicia(){
    var v = 20;
    try{
      var raw = localStorage.getItem('td-bright');
      v = (raw !== null) ? Number(raw) : (localStorage.getItem('td-theme') === 'light' ? 80 : 20);
    }catch(e){}
    aplica(v);
  }
  if(document.body) inicia();
  else document.addEventListener('DOMContentLoaded', inicia);
})();
</script>
